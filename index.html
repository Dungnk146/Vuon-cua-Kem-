/* --- Cho đi, bằng nhau: sơ đồ đoạn thẳng (Toán Archimedes quyển 4, giải toán bằng sơ đồ) --- */
function genChuyenBang(lv){
  const [a,b]=shuffle(NAMES).slice(0,2),T=[],th=pick(["viên bi","quyển vở","chiếc tem","quả cam"]);
  T.push(()=>{const k=ri(2,6);return mkNum("chuyenbang",a+" và "+b+" có số "+th+" khác nhau. Nếu "+a+" cho "+b+" "+k+" "+th+" thì số "+th+" của hai bạn bằng nhau.\nHỏi lúc đầu "+a+" nhiều hơn "+b+" bao nhiêu "+th+"?",2*k,"Cho đi "+k+" thì "+a+" bớt "+k+" và "+b+" thêm "+k+" mới bằng nhau. Vậy lúc đầu hơn nhau "+k+" + "+k+" = "+(2*k)+".","Vẽ hai đoạn thẳng. "+a+" bớt "+k+", "+b+" thêm "+k+" thì bằng nhau, nên chênh nhau 2 lần "+k+".")});
  if(lv>=2){
    T.push(()=>{const k=ri(2,5),m=ri(k+2,12);return mkNum("chuyenbang",a+" có "+(m+k)+" "+th+". Nếu "+a+" cho "+b+" "+k+" "+th+" thì hai bạn có số "+th+" bằng nhau.\nHỏi lúc đầu "+b+" có bao nhiêu "+th+"?",m-k,"Sau khi cho, "+a+" còn "+(m+k)+" − "+k+" = "+m+". Lúc đó "+b+" cũng có "+m+", mà "+b+" vừa được thêm "+k+" nên lúc đầu "+b+" có "+m+" − "+k+" = "+(m-k)+".","Tìm số lúc bằng nhau trước. Rồi trả lại phần "+b+" vừa nhận.")});
    T.push(()=>{const k=ri(2,6),m=ri(k+3,15);return mkNum("chuyenbang",a+" và "+b+" có tất cả một số "+th+". Nếu "+a+" cho "+b+" "+k+" "+th+" thì hai bạn đều có "+m+" "+th+".\nHỏi lúc đầu "+a+" có bao nhiêu "+th+"?",m+k,"Lúc bằng nhau mỗi bạn có "+m+". "+a+" đã cho đi "+k+" nên lúc đầu "+a+" có "+m+" + "+k+" = "+(m+k)+".","Trả lại phần đã cho đi cho "+a+".")});
  }
  if(lv>=3){
    T.push(()=>{const k=ri(2,5),d=ri(2,6);return mkNum("chuyenbang",a+" và "+b+" cùng gấp thuyền. Nếu "+a+" cho "+b+" "+k+" chiếc thì số thuyền của "+a+" vẫn nhiều hơn của "+b+" là "+d+" chiếc.\nHỏi lúc đầu "+a+" gấp nhiều hơn "+b+" bao nhiêu chiếc thuyền?",d+2*k,"Cho đi "+k+" thì chênh lệch giảm "+k+" + "+k+" = "+(2*k)+". Sau khi cho còn hơn "+d+", nên lúc đầu hơn "+d+" + "+(2*k)+" = "+(d+2*k)+".","Mỗi lần cho đi k chiếc, khoảng cách giữa hai bạn giảm 2 lần k. Cộng lại để tìm khoảng cách ban đầu.")});
    T.push(()=>{const k=ri(2,5),d=ri(k+2,k+6);return mkNum("chuyenbang","Hai tổ cùng nhận cờ thi đua. Cuối tuần tổ Một được nhận thêm "+k+" lá cờ nên nhiều hơn tổ Hai "+d+" lá cờ.\nHỏi lúc đầu tổ Một nhiều hơn tổ Hai bao nhiêu lá cờ?",d-k,"Tổ Một nhận thêm "+k+" lá thì hơn nhau "+d+". Vậy lúc đầu hơn "+d+" − "+k+" = "+(d-k)+" lá.","Bỏ phần nhận thêm đi: khoảng cách ban đầu nhỏ hơn.")});
  }
  return pick(T)();

/* --- Tính ngược từ cuối (Toán Archimedes quyển 4) --- */
function genNguoc(lv){
  const n=lv+1;let x=ri(12,60),cur=x;const ops=[];
  for(let i=0;i<n;i++){
    for(let t=0;t<40;t++){const k=ri(3,25),add=R()<.5;const v=add?cur+k:cur-k;if(v>=1&&v<=100){ops.push([add,k,cur,v]);cur=v;break}}
  }
  if(ops.length<n)return genNguoc(lv);
  const story=lv>=2&&R()<.5,nm=pick(NAMES),th=pick(["viên bi","cái kẹo","quyển vở"]);
  const back=ops.slice().reverse().map(o=>o[3]+(o[0]?" − ":" + ")+o[1]+" = "+o[2]).join(", rồi ");
  let q;
  if(story){q="Bạn "+nm+" có một số "+th+". "+ops.map(o=>o[0]?"Bạn nhận thêm "+o[1]+" "+th+"":"Bạn cho đi "+o[1]+" "+th).join(", rồi ")+". Bây giờ bạn có "+cur+" "+th+".\nHỏi lúc đầu bạn có bao nhiêu "+th+"?"}
  else{q="Tìm một số, biết số đó "+ops.map(o=>o[0]?"cộng "+o[1]:"trừ "+o[1]).join(", rồi ")+" thì được kết quả là "+cur+"."}
  return mkNum("nguoc",q,x,"Làm ngược từ cuối: "+back+". Số cần tìm là "+x+".","Đi ngược lại: phép cộng đổi thành trừ, phép trừ đổi thành cộng, bắt đầu từ kết quả cuối.");
}

/* --- Cộng, trừ với 100 --- */
function genTong100(lv){
  const T=[];
  T.push(()=>{const a=ri(1,9)*10;return mkNum("tong100",a+" + ? = 100",100-a,a+" + "+(100-a)+" = 100. (Cộng số chục với số chục: "+(a/10)+" chục + "+((100-a)/10)+" chục = 10 chục.)","Mười chục là 100. Cần thêm mấy chục?")});
  if(lv>=2){
    T.push(()=>{const a=ri(11,89);return mkNum("tong100","100 − "+a+" = ?",100-a,"100 − "+a+" = "+(100-a)+". (Thử lại: "+(100-a)+" + "+a+" = 100.)","Lấy 100 trừ, hoặc tìm số cộng với "+a+" được 100.")});
    T.push(()=>{const a=ri(11,89);return mkNum("tong100",a+" + ? = 100",100-a,a+" + "+(100-a)+" = 100.","Số cần tìm là 100 trừ "+a+".")});
  }
  if(lv>=3){
    T.push(()=>{let a,b;do{a=ri(15,50);b=ri(15,50)}while(a+b>95);return mkNum("tong100","100 − "+a+" − "+b+" = ?",100-a-b,"100 − "+a+" = "+(100-a)+", rồi "+(100-a)+" − "+b+" = "+(100-a-b)+".","Trừ lần lượt từng số từ trái sang phải.")});
    T.push(()=>{let a,b;do{a=ri(15,45);b=ri(15,45)}while(a+b>95);return mkNum("tong100",a+" + "+b+" + ? = 100",100-a-b,a+" + "+b+" = "+(a+b)+". Còn thiếu "+(100-a-b)+" để đủ 100.","Cộng hai số đã biết trước, rồi tìm số cộng với tổng đó được 100.")});
  }
  return pick(T)();
}

function weekStats(){
  const t=todayKey();let done=0,c=0,n=0,st=0;
  for(let i=0;i<7;i++){const d=S.days[addDays(t,-i)];if(!d)continue;if(d.done)done++;c+=(d.correct||0)+(d.xcorrect||0)+(d.hcorrect||0);n+=(d.total||0)+(d.xtotal||0)+(d.htotal||0);st+=(d.stars||0)+(d.xstars||0)+(d.hstars||0)}
  const from=addDays(t,-6);S.ledger.forEach(e=>{if(e.date>=from)st+=e.pts});
  return{done,c,n,st,acc:n?Math.round(c/n*100):null};
}
function skillTag(k){
  if(!k||!k.done)return'<span class="tag n">Chưa làm</span>';
  const a=k.correct/k.done;return a>=.8?'<span class="tag g">Vững</span>':a>=.5?'<span class="tag m">Đang tiến bộ</span>':'<span class="tag b">Cần ôn</span>';
}
function ansText(q){return q.type==="number"?String(q.a):q.opts[q.a]}

   '<div><b class="small">Số câu mỗi ngày</b><div class="seg" style="margin-top:6px">'+[5,10,15].map(n=>'<button data-act="perday" data-n="'+n+'" aria-pressed="'+(p.perDay===n)+'">'+n+' câu</button>').join("")+'</div></div>'+
   '<p class="small muted" id="status"></p>'+
   (ui.confirm?'<div class="fb no"><b>Xóa toàn bộ tiến độ?</b><span>Sao, huy hiệu, lịch sử và vở sửa lỗi sẽ mất và không khôi phục được.</span><div class="row"><button class="btn warn" data-act="resetDo">Xóa hết</button><button class="btn alt" data-act="resetNo">Giữ lại</button></div></div>':'<button class="btn alt" data-act="resetAsk">Xóa toàn bộ dữ liệu</button>')+'</div>';
  return o;

/* ===== Kết quả kiểm tra đầu vào, lộ trình ===== */
function ratingChip(r){return r==="ind"?'<span class="chip ok">Làm độc lập</span>':r==="hint"?'<span class="chip vi">Làm khi có gợi ý</span>':'<span class="chip err">Cần học lại</span>'}
function placeBlock(ev){
  const toan=ev.subj==="toan",name=toan?"Toán":"Tiếng Việt";
  let o='<div class="card"><h2>Kết quả kiểm tra đầu vào: '+name+'</h2><div class="chips"><span class="chip ok">'+ev.counts.ind+' câu làm độc lập</span><span class="chip vi">'+ev.counts.hint+' câu sau gợi ý</span><span class="chip err">'+ev.counts.no+' câu cần học lại</span></div>';
  const rows=g=>'<div class="scope"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><b>'+esc(PLACE_GROUPS[g.g].name)+'</b><div class="small muted">'+esc(PLACE_GROUPS[g.g].ref)+'</div></div>'+ratingChip(g.rating)+'</div></div>';
  o+=ev.groups.filter(g=>!PLACE_GROUPS[g.g].adv).map(rows).join("");
  const adv=ev.groups.filter(g=>PLACE_GROUPS[g.g].adv);
  if(adv.length)o+='<h3>Thử thách nâng cao</h3>'+adv.map(rows).join("")+'<p class="small muted">Chỉ có 1 câu nâng cao nên chỉ dùng để tham khảo, không dùng để kết luận.</p>';
  o+='<p class="small">'+(ev.adv?'Con đã khá vững phần cơ bản. Bài nâng cao tư duy sẽ được xen vào các buổi học hằng ngày với số câu ít.':'Phần cơ bản cần củng cố thêm nên bài nâng cao chưa được xen vào buổi học hằng ngày. Con vẫn có thể thử ở tab Luyện thêm.')+'</p>';
  if(!toan)o+='<h3>Phụ huynh cần quan sát thêm</h3><p class="small muted">Bài trên máy không kiểm tra được đọc thành tiếng, viết chữ và nói nghe. Nên xem thêm:</p><ul class="small"><li>Con đọc to một đoạn khoảng 5 câu trong bài đã học: đọc đúng, ngắt nghỉ, hiểu nghĩa.</li><li>Con viết 3 câu theo lời đọc: chữ viết, chính tả, dấu câu, viết hoa.</li><li>Con kể lại một việc đã làm ở nhà bằng 2 đến 3 câu.</li></ul>';
  return o+'</div>';
}

   '<p class="small muted">Kiểm tra chỉ có 14 câu mỗi môn, đây là bài luyện bổ sung do Claude soạn, không thay cho đánh giá của giáo viên.</p></div>';

function renderPlaceRes(){
  const P=S.place,sb=ui.placeSubj,list=sb?[sb]:["toan","vi"];

/* ===== Màn hình làm bài ===== */
const curSess=()=>ui.play==="daily"?S.daily:ui.play==="place"?S.place.cur[ui.placeSubj]:S.extra;
function resetInput(){ui.sel=null;ui.num="";ui.fb=null;ui.try=1;ui.tried=[];ui.hintOn=false}
function renderPlay(){
  if(ui.play==="placeRes")return renderPlaceRes();
  const s=curSess();if(!s){ui.play=null;return header()+viewHome()}
  if(s.finished)return renderResult(s);
  if(ui.inter&&ui.play==="daily")return renderInter(ui.inter);
  const q=s.qs[s.i],total=s.qs.length,fb=ui.fb,def=SKILLS[q.skill];
  let o='<div class="top"><button class="btn alt" data-act="exit">Thoát</button><div class="pills"><span class="pill">Câu '+(s.i+1)+'/'+total+'</span></div></div>';
  o+='<div class="card"><div class="bar"><i style="width:'+Math.round(s.i/total*100)+'%"></i></div><div class="chips"><span class="chip'+(def.subj==="vi"?" vi":"")+'">'+esc(def.name)+'</span>'+(q.retry?'<span class="chip err">Câu sửa lỗi</span>':'')+(s.mode==="extra"?'<span class="chip ok">'+esc(s.label||"Luyện thêm")+' · không bắt buộc</span>':'')+(s.mode==="place"?'<span class="chip ok">Kiểm tra đầu vào</span>':'')+'</div>';
  if(q.ctx)o+='<div class="ctx">'+fmt(q.ctx)+'</div>';
  if(q.viz)o+='<div class="viz'+(q.viz.k?' pic':'')+'">'+vizHTML(q.viz)+'</div>';
  o+='<div class="qtext">'+fmt(q.prompt)+'</div>';
  if(q.type==="choice"){
    const long=q.opts.some(x=>x.length>12),tri=q.opts.length===3&&!long;
    o+='<div class="opts'+(long&&q.opts.some(x=>x.length>22)?" one":"")+'"'+(tri?' style="grid-template-columns:repeat(3,1fr)"':'')+'>'+q.opts.map((x,i)=>{
      let c="opt";const tr=(ui.tried||[]).includes(i);if(fb){if(i===q.a)c+=" right";else if(i===ui.sel||tr)c+=" wrong"}else if(tr)c+=" wrong";
      return '<button class="'+c+'" data-act="pick" data-i="'+i+'" aria-pressed="'+(ui.sel===i)+'"'+(fb||tr?" disabled":"")+'>'+esc(x)+'</button>'}).join("")+'</div>';
  }else{
    o+='<div class="numbox'+(fb?(fb.ok?" right":" wrong"):"")+'" aria-live="polite">'+(ui.num===""?'<span class="muted">…</span>':esc(ui.num))+'</div>'+
     '<div class="keys">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-act="key" data-k="'+n+'"'+(fb?" disabled":"")+'>'+n+'</button>').join("")+
     '<button class="key" data-act="key" data-k="del" style="font-size:1rem"'+(fb?" disabled":"")+'>Xóa</button><button class="key" data-act="key" data-k="0"'+(fb?" disabled":"")+'>0</button><span></span></div>';
  }
  if(fb){
    o+=fb.ok?'<div class="fb ok"><b>Đúng rồi!'+(fb.gain?" +1 sao":"")+'</b>'+(fb.st==="hint"?'<span>Con đã làm được sau khi xem gợi ý.</span>':'')+(q.hard&&q.why?'<span class="small"><b style="font-size:inherit">Cách làm:</b> '+esc(q.why)+'</span>':'')+'</div>':
      '<div class="fb no"><b>Chưa đúng</b><span>Đáp án đúng: <b>'+esc(ansText(q))+'</b></span>'+(q.why?'<span><b style="font-size:inherit">Cách làm:</b> '+esc(q.why)+'</span>':'')+'<span class="small">Câu này sẽ quay lại trong bài những ngày sau để con ôn.</span></div>';
    o+='<button class="btn big" data-act="next">'+(s.i>=total-1?"Xem kết quả":"Câu tiếp theo")+'</button>';
  }else{
    if(typeof speechBar==="function")o+=speechBar(q);
    if(s.mode!=="place"&&q.hint&&!ui.hintOn)o+='<button class="btn alt hintbtn" data-act="hint">💡 Xem gợi ý</button>';
    if(s.mode==="place"&&ui.try>1||s.mode!=="place"&&ui.hintOn)o+='<div class="fb hint"><b>Gợi ý</b><span>'+esc(q.hint||"Đọc kỹ đề và thử lại.")+'</span><span class="small">'+(ui.try>1?'Con thử lại một lần nữa nhé.':'Con có thể làm tiếp khi đã đọc gợi ý.')+'</span></div>';
    const ready=q.type==="number"?ui.num!=="":ui.sel!==null;
    o+='<button class="btn big" data-act="check"'+(ready?"":" disabled")+'>Kiểm tra</button>';
  }
  return o+'</div>';
}
function renderResult(s){
  const sm=s.summary||{correct:s.res.filter(r=>r&&r.ok).length,total:s.qs.length,bonus:0,stars:s.gain||0,newBadges:[],streak:streak()};
  const r=sm.correct/sm.total,kn=esc(S.profile.name),
    msg=r===1?"Tuyệt vời! "+kn+" làm đúng hết, bố mẹ rất tự hào!":r>=.8?"Giỏi lắm! "+kn+" làm bài rất tốt.":r>=.5?"Cố gắng tốt! Những câu sai sẽ được ôn lại ở các bài sau.":"Không sao đâu "+kn+" nhé. Mỗi câu sai là một lần học thêm.";
  let o='<div class="top"><span></span></div><div class="card res">'+avatarHTML(72)+'<div class="muted">'+(s.mode==="daily"?"Bài hôm nay":(s.label||"Luyện thêm"))+'</div><div class="score">'+sm.correct+'/'+sm.total+'</div><h2>'+msg+'</h2>'+
   '<div class="pills"><span class="pill star">'+starI+'+'+sm.stars+' sao</span>'+(s.mode==="daily"?'<span class="pill fire">'+fireI+sm.streak+' ngày liên tiếp</span>':'')+'</div>'+
   (s.res.some(r=>r&&r.hint)?'<p class="small muted">Con đã dùng gợi ý ở '+s.res.filter(r=>r&&r.hint).length+' câu. Những câu này nên làm lại một lần nữa nhé.</p>':'')+(sm.bonus?'<p class="small muted">Gồm '+sm.bonus+' sao thưởng (hoàn thành bài, điểm tuyệt đối, mốc chuỗi ngày).</p>':'')+
   (sm.newBadges.length?'<div class="chips" style="justify-content:center">'+sm.newBadges.map(id=>'<span class="chip ok">Huy hiệu mới: '+BADGES.find(b=>b.id===id).name+'</span>').join("")+'</div>':'')+'</div>';
  const wrong=s.qs.map((q,i)=>({q,i})).filter(x=>!(s.res[x.i]&&s.res[x.i].ok));
  if(wrong.length)o+='<div class="card"><h3>Những câu cần xem lại</h3>'+wrong.map(x=>'<div class="err-item"><span>'+esc(flat(x.q.ctx?x.q.prompt:x.q.prompt))+(x.q.viz?'<div class="viz pic mini">'+vizHTML(x.q.viz)+'</div>':'')+'</span><b>Đáp án: '+esc(ansText(x.q))+'</b>'+(x.q.why?'<small class="why">'+esc(x.q.why)+'</small>':'')+'</div>').join("")+'</div>';
  const back=ui.resume&&s.mode==="extra";
  return o+(back?'<button class="btn big" data-act="resume">'+(S.daily.finished?"Xem kết quả bài hôm nay":"Tiếp tục bài hôm nay")+'</button>':'<button class="btn big" data-act="exit">Về trang chính</button>');
}

/* ===== Điều khiển ===== */
function advance(s){
  while(!s.finished&&s.res[s.i]){
    const cur=s.qs[s.i],nxt=s.qs[s.i+1],sec=SKILLS[cur.skill].subj;
    if(s.mode==="daily"&&(!nxt||SKILLS[nxt.skill].subj!==sec)&&!(s.offered&&s.offered[sec])){
      s.offered=s.offered||{};s.offered[sec]=true;s.pend=sec;ui.inter=sec;persist();return;
    }
    if(s.i>=s.qs.length-1){finish(s);break}
    s.i++;
  }
}
function rebuildToday(){if(S.daily&&!S.daily.res.length&&!S.daily.finished)S.daily=buildSession("daily",todayKey())}
function act(a,ds){
  let keep=false;
  if(/^(sp|df|ql|ws|dr|pf|kt)_/.test(a)){const y=window.scrollY;extraAct(a,ds);render();window.scrollTo(0,a==="dr_place"?0:y);return}
  if(a.slice(0,2)==="g_"){gameAct(a,ds);render();if(a==="g_open")window.scrollTo(0,0);return}
  if(/^(sh|hm)_/.test(a)){const y=window.scrollY,t=ui.tab;shopAct(a,ds);render();if(ui.tab===t)window.scrollTo(0,y);else window.scrollTo(0,0);return}
  switch(a){
    case"tab":ui.tab=ds.t;ui.confirm=false;ui.msg=null;ui.custom=null;ui.forgot=false;ui.pinErr=false;if(ds.t!=="game")ui.game=null;if(ds.t!=="parent")ui.unlocked=false;break;
    case"calSel":ui.calSel=ds.k;keep=true;break;
    case"calMove":{const c=calState();let m=c.m+Number(ds.d),y=c.y;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal={y,m};keep=true;break}
    case"resMore":ui.resMore=!ui.resMore;keep=true;break;
    case"startHai":S.extra=buildSession("extra",todayKey(),{hai:true,n:5,label:"Bài hái sao",salt:String(Date.now())});persist();ui.play="extra";resetInput();break;
    case"pinCreate":{const a1=(document.getElementById("pin-new")||{}).value||"",a2=(document.getElementById("pin-new2")||{}).value||"";
      if(!/^\d{4}$/.test(a1))ui.pinErr="Mã PIN cần đúng 4 chữ số.";else if(a1!==a2)ui.pinErr="Hai lần nhập chưa giống nhau.";
      else{S.profile.pin=a1;S.profile.recovery=String(Math.floor(100000+Math.random()*900000));ui.pinErr=false;ui.showRec=true;ui.unlocked=true;persist()}
      keep=true;break}
    case"recSaved":ui.showRec=false;break;
    case"recMake":S.profile.recovery=String(Math.floor(100000+Math.random()*900000));ui.showRec=true;persist();break;
    case"lockNow":ui.unlocked=false;break;
    case"forgot":ui.forgot=true;ui.pinErr=false;keep=true;break;
    case"forgotNo":ui.forgot=false;ui.pinErr=false;keep=true;break;
    case"pinRecover":{const el=document.getElementById("rec-in");if(el&&S.profile.recovery&&el.value===S.profile.recovery){S.profile.pin="";ui.forgot=false;ui.pinErr=false;ui.unlocked=false;persist()}else ui.pinErr=true;keep=true;break}
    case"tdel":{const L=ownTasks(),i=L.findIndex(x=>x.id===ds.id);if(i>=0)L.splice(i,1);persist();keep=true;break}
    case"tadd":{ownTasks().push({id:"t"+Date.now(),t:ds.t,label:ds.t==="bonus"?"Nhiệm vụ mới":"Mục trừ mới",pts:ds.t==="bonus"?2:1});persist();keep=true;break}
    case"msicon":{S.profile.milestones[Number(ds.i)].icon=ds.v;persist();keep=true;break}
    case"msgiven":{const m=S.profile.milestones[Number(ds.i)];m.given=!m.given;persist();keep=true;break}
    case"msreset":S.profile.milestones=DEF_MS();persist();keep=true;break;
    case"giftIcon":case"giftCat":case"giftDo":case"giftDel":case"shopAdd":case"shopHideIt":case"custDel":parentGiftAct(a,ds);keep=true;break;
    case"avatar":S.profile.avatar=ds.v;persist();keep=true;break;
    case"by":ui.by=ds.v;keep=true;break;
    case"award":{const t=taskList().find(x=>x.id===ds.id);if(t)applyTask(t.t,t.label,taskPts(t),"",t.id);keep=true;break}
    case"customOpen":ui.custom=ui.custom===ds.t?null:ds.t;keep=true;break;
    case"customDo":{
      const pe=document.getElementById("cust-pts"),ne=document.getElementById("cust-note"),n=Math.round(Number(pe&&pe.value));
      if(!(n>=1&&n<=100)){showToast("Hãy nhập số sao từ 1 đến 100.",0)}
      else{applyTask(ui.custom,ui.custom==="bonus"?"Thưởng khác":"Trừ khác",n,((ne&&ne.value)||"").trim().slice(0,60),"");ui.custom=null}
      keep=true;break}
    case"undo":undoTask(Number(ds.n));keep=true;break;
    case"unlock":{const el=document.getElementById("pin-in");if(el&&el.value===S.profile.pin){ui.unlocked=true;ui.pinErr=false}else ui.pinErr=true;keep=true;break}
    case"startDaily":ensureDaily();ui.play="daily";ui.resume=null;ui.inter=S.daily.pend||null;if(!ui.inter)advance(S.daily);resetInput();break;
    case"skipBonus":{const s=S.daily;s.pend=null;ui.inter=null;advance(s);persist();resetInput();break}
    case"doBonus":{
      const s=S.daily,sec=ui.inter||s.pend;s.pend=null;ui.inter=null;advance(s);
      S.extra=buildSession("extra",todayKey(),{subj:sec,n:3,salt:String(Date.now()),label:"Bài tập thêm "+(sec==="toan"?"Toán":"Tiếng Việt")});
      persist();ui.resume="daily";ui.play="extra";resetInput();break}
    case"resume":ui.play=ui.resume||null;ui.resume=null;resetInput();break;
    case"skilltoggle":{S.profile.skillOff=S.profile.skillOff||{};if(ds.v==="0")S.profile.skillOff[ds.id]=true;else delete S.profile.skillOff[ds.id];rebuildToday();persist();keep=true;break}
    case"skillcap":{S.profile.cap=S.profile.cap||{};S.profile.cap[ds.id]=Number(ds.n);rebuildToday();persist();keep=true;break}
    case"result":ui.play="daily";break;
    case"startExtra":S.extra=buildSession("extra",todayKey(),{subj:ds.subj,skill:ds.skill,pic:!!ds.pic,think:!!ds.think,label:ds.pic?"Luyện qua hình":(ds.label||""),salt:String(Date.now())});persist();ui.play="extra";resetInput();break;
    case"startErrors":S.extra={mode:"extra",date:todayKey(),qs:S.errors.slice(0,5).map(e=>Object.assign({},e.q)),i:0,res:[],finished:false,started:Date.now()};persist();ui.play="extra";resetInput();break;
    case"pick":if(!ui.fb)ui.sel=Number(ds.i);keep=true;break;
    case"key":if(!ui.fb){if(ds.k==="del")ui.num=ui.num.slice(0,-1);else if(ui.num.length<3)ui.num=(ui.num==="0"?"":ui.num)+ds.k}keep=true;break;
    case"check":{const s=curSess(),q=s.qs[s.i];if(ui.fb)return;const g=q.type==="number"?(ui.num===""?null:ui.num):ui.sel;if(g===null)return;
      if(s.mode==="place"){const r=answerPlace(s,g);if(r.retry){ui.try=2;if(q.type==="choice")ui.tried.push(g);ui.sel=null;ui.num="";ui.fb=null}else ui.fb=r}else{const hinted=!!ui.hintOn||ui.try>1;
        if(!hinted&&q.hard&&q.hint&&!isCorrect(q,g)){ui.try=2;ui.hintOn=true;if(q.type==="choice")ui.tried.push(g);ui.sel=null;ui.num="";ui.fb=null}
        else{ui.fb=answer(s,g,{hint:hinted});if(hinted&&ui.fb.ok)ui.fb.st="hint"}}
      keep=true;break}
    case"hint":ui.hintOn=true;keep=true;break;
    case"next":{const s=curSess();if(s.mode==="place"){advancePlace(s);persist();resetInput();break}advance(s);persist();resetInput();break}
    case"placeStart":{const P=S.place,sb=ds.subj;if(!P.cur[sb])P.cur[sb]=buildPlacement(sb);const s=P.cur[sb];
      while(s.res[s.i]&&s.i<s.qs.length-1)s.i++;persist();resetInput();
      if(s.res[s.qs.length-1]){finishPlace(s)}else{ui.play="place";ui.placeSubj=sb}break}
    case"placeView":ui.play="placeRes";ui.placeSubj=ds.subj||null;break;
    case"placeRedo":{const P=S.place,sb=ds.subj;P.res[sb]=null;delete P.res[sb];delete P.cur[sb];P.adv[sb]=false;P.runs=(P.runs||0)+1;S.focus=S.focus.filter(id=>SKILLS[id]&&SKILLS[id].subj!==sb);rebuildToday();persist();keep=true;break}
    case"advset":S.place.adv[ds.subj]=ds.v==="1";rebuildToday();persist();keep=true;break;
    case"exit":ui.play=null;ui.resume=null;ui.inter=null;resetInput();break;
    case"perday":S.profile.perDay=Number(ds.n);if(S.daily&&!S.daily.res.length&&!S.daily.finished)S.daily=buildSession("daily",todayKey());persist();keep=true;break;
    case"exportData":exportData();keep=true;break;
    case"resetAsk":ui.confirm=true;keep=true;break;
    case"resetNo":ui.confirm=false;keep=true;break;
    case"resetDo":S=defaults();ui.confirm=false;ui.unlocked=false;ui.tab="home";ensureDaily();persist();break;
  }
  render();if(!keep)window.scrollTo(0,0);
}
function render(){
  if(ui.play)$app().innerHTML=renderPlay();
  else $app().innerHTML=header()+({home:viewHome,daily:viewDaily,practice:viewPractice,prog:viewProg,reward:viewReward,shop:viewShop,house:viewHouse,game:viewGames,parent:viewParent}[ui.tab])();
  renderTabs();paintStatus();if(typeof afterRender==="function")afterRender();
}
function onClick(e){const b=e.target.closest("[data-act]");if(b&&!b.disabled)act(b.dataset.act,b.dataset)}
$app().addEventListener("click",onClick);
document.getElementById("tabs").addEventListener("click",onClick);
$app().addEventListener("change",e=>{
  if(e.target.id==="impFile"){const f=e.target.files&&e.target.files[0];if(f){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)}return}
  const t=e.target,k=t.dataset&&t.dataset.set;if(!k)return;
  if(k==="name")S.profile.name=t.value.trim()||"Bé";
  if(k==="avatar"){const v=Array.from(t.value.trim()).slice(0,2).join("");if(v){S.profile.avatar=v;persist();render()}t.value="";return}
  if(k==="rname")S.profile.rewardName=t.value.trim()||"Phần thưởng";
  if(k==="pin"){const v=t.value.replace(/\D/g,"").slice(0,4);if(v.length===4){S.profile.pin=v;showToast("Đã đổi mã PIN.",0)}t.value=""}
  if(k==="tlabel"){const x=ownTasks().find(y=>y.id===t.dataset.id);if(x){x.label=t.value.trim().slice(0,40)||x.label;t.value=x.label}}
  if(k==="tpts"){const x=ownTasks().find(y=>y.id===t.dataset.id);if(x){x.pts=Math.min(50,Math.max(1,Math.round(Number(t.value))||1));t.value=x.pts}}
  if(k==="msat"){const m=S.profile.milestones[Number(t.dataset.i)];m.at=Math.min(9999,Math.max(1,Math.round(Number(t.value))||m.at));t.value=m.at}
  if(k==="mstext"){const m=S.profile.milestones[Number(t.dataset.i)];m.text=t.value.trim().slice(0,50)||m.text;t.value=m.text}
  if(k==="msicon"){const m=S.profile.milestones[Number(t.dataset.i)],v=t.value.trim();if(v){m.icon=Array.from(v).slice(0,2).join("");persist();render();return}}
  if(k==="pts"){const n=Math.min(50,Math.max(1,Math.round(Number(t.value))||1));S.profile.taskPts[t.dataset.id]=n;t.value=n}
  if(k==="lesson"){S.profile.mathLesson=Math.min(36,Math.max(1,Number(t.value)||31));rebuildToday();persist();render();return}
  if(k==="rtarget"){S.profile.rewardTarget=Math.min(1000,Math.max(10,Math.round(Number(t.value))||100));t.value=S.profile.rewardTarget}
  persist();
});
document.addEventListener("keydown",e=>{
  if(!ui.play||e.target.tagName==="INPUT")return;const s=curSess();if(!s||s.finished||ui.inter)return;
  if(e.key==="Enter"&&e.target.tagName==="BUTTON")return;
  const q=s.qs[s.i];
  if(ui.fb){if(e.key==="Enter")act("next",{});return}
  if(q.type!=="number")return;
  if(/^[0-9]$/.test(e.key))act("key",{k:e.key});else if(e.key==="Backspace")act("key",{k:"del"});else if(e.key==="Enter")act("check",{});
});
(function init(){
  const l=loadLocal();if(l)S=mergeState(l);else if(SEED_STATE){try{S=mergeState(SEED_STATE);saveLocal()}catch(e){}}
  ensureDaily();render();connectDb();
})();
</script>

  let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(rl)return;rl=true;location.reload()});
