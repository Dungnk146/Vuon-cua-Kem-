<style>
/* Layout: một cột, thanh trên có sao và chuỗi ngày, thanh tab dưới; chủ đề khu vườn nhỏ lớn dần theo số sao */
:root{
  --bg:#F2F8F1; --surface:#FFFFFF; --fg:#1B2B22; --muted:#587062; --line:#D6E5D9;
  --leaf:#2A9858; --leaf-ink:#FFFFFF; --leaf-soft:#DCF0E2;
  --sun:#EFAE12; --sun-ink:#3B2A00; --sun-soft:#FFF0C4;
  --sky:#2F85D0; --sky-soft:#DDEBFA;
  --bad:#CF3F37; --bad-soft:#FCE2DF; --soil:#8A5A3B;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1914; --surface:#172620; --fg:#E7F2EA; --muted:#9DB4A5; --line:#27392F;
  --leaf:#4CC47E; --leaf-ink:#08210F; --leaf-soft:#1C3A2A;
  --sun:#F4C13F; --sun-ink:#2D2100; --sun-soft:#3A3115;
  --sky:#6CB2F0; --sky-soft:#1B3047;
  --bad:#FF7B71; --bad-soft:#3F201D; --soil:#B58260; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1914; --surface:#172620; --fg:#E7F2EA; --muted:#9DB4A5; --line:#27392F;
  --leaf:#4CC47E; --leaf-ink:#08210F; --leaf-soft:#1C3A2A;
  --sun:#F4C13F; --sun-ink:#2D2100; --sun-soft:#3A3115;
  --sky:#6CB2F0; --sky-soft:#1B3047;
  --bad:#FF7B71; --bad-soft:#3F201D; --soil:#B58260; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;flex-wrap:wrap}
.hello{font-family:var(--display);font-size:1.3rem;font-weight:700}
.hello small{display:block;font-family:var(--body);font-size:.85rem;font-weight:600;color:var(--muted)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;background:var(--surface);border:2px solid var(--line)}
.pill.star{background:var(--sun-soft);border-color:var(--sun)}
.pill.fire{background:var(--leaf-soft);border-color:var(--leaf)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.plain{border:0;background:transparent;padding:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:16px;padding:14px 22px;font-weight:800;font-size:1.05rem;background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.big{width:100%;font-size:1.25rem;padding:18px 22px;font-family:var(--display)}
.btn.alt{background:var(--surface);color:var(--fg);border:2px solid var(--line);box-shadow:none}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.warn{background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.bar{height:14px;border-radius:99px;background:var(--leaf-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--leaf);border-radius:99px;transition:width .5s}
.bar.sun{background:var(--sun-soft)} .bar.sun>i{background:var(--sun)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.chip.err{background:var(--bad-soft)} .chip.vi{background:var(--sun-soft)} .chip.ok{background:var(--leaf-soft)}
.garden{display:flex;gap:16px;align-items:center}
.garden svg{width:130px;height:150px;flex:none}
.week{display:flex;gap:6px}
.dot{flex:1;min-width:0;text-align:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.dot b{display:block;margin:3px auto 0;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.dot.done b{background:var(--leaf);border-color:var(--leaf)}
.dot.today b{border-color:var(--sky)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs div{display:flex;width:100%;max-width:720px;gap:6px}
.tab{flex:1;border:0;background:transparent;border-radius:14px;padding:8px 4px;font-weight:800;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{background:var(--leaf-soft);color:var(--fg)}
.qhead{display:flex;align-items:center;gap:12px}

.qtext{font-family:var(--display);font-size:1.6rem;font-weight:700;line-height:1.3;white-space:pre-line}

.viz{display:flex;justify-content:center}

.viz.pic{margin:6px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;font-size:1.2rem;font-weight:800;text-align:left;min-width:0;overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt.right{border-color:var(--leaf);background:var(--leaf-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.numbox{font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;border:3px solid var(--line);border-radius:16px;min-height:68px;padding:4px 12px;font-variant-numeric:tabular-nums}
.numbox.right{border-color:var(--leaf);background:var(--leaf-soft)} .numbox.wrong{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 0;font-family:var(--display);font-size:1.5rem;font-weight:700}
.key:disabled{opacity:.5}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.fb.hint{background:var(--sun-soft)} .fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-family:var(--display);font-size:1.25rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.badge svg{width:52px;height:52px}
.badge.lock{opacity:.55}
.badge b{font-size:.9rem;line-height:1.2} .badge span{font-size:.75rem;color:var(--muted);line-height:1.25}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.skill .bar{grid-column:1/-1;height:10px}
.tag{font-size:.75rem;font-weight:800;padding:2px 9px;border-radius:99px}
.tag.g{background:var(--leaf-soft)} .tag.m{background:var(--sun-soft)} .tag.b{background:var(--bad-soft)} .tag.n{background:var(--line)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 16px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
input[type=text],input[type=number],input[type=password]{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
label{font-weight:800;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.grp-h{font-weight:700;color:var(--muted);font-size:.85rem;margin:10px 0 4px}.hintbtn{margin-top:8px}.why{color:var(--muted);font-size:.85rem;line-height:1.4}
.err-item{border-top:2px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:300px;height:auto}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px;font-weight:700}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;font-weight:800;display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.25}
.tbtn i{font-style:normal;font-size:.85rem;font-weight:800;color:var(--muted)}
.tbtn.plus{border-color:var(--leaf);background:var(--leaf-soft)}
.tbtn.minus{border-color:var(--bad);background:var(--bad-soft)}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));max-width:688px;margin-inline:auto;z-index:6;
  border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--sky-soft);border:2px solid var(--sky);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.ledger{display:flex;justify-content:space-between;gap:10px;border-top:2px dashed var(--line);padding-top:8px;align-items:center}
.delta{font-family:var(--display);font-weight:800;font-size:1.1rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.p{color:var(--leaf)} .delta.m{color:var(--bad)}
.ptsrow{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:center}
.ptsrow span{font-weight:700}
select{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
details summary{cursor:pointer;font-weight:800}
details p{margin-top:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:52px;height:auto;flex:none}
.res .chico{width:72px;height:auto}
.scope{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:8px}
.hide{display:none!important}
.res{text-align:center;align-items:center}
.res .score{font-family:var(--display);font-size:3.4rem;font-weight:800;line-height:1}
@media (max-width:420px){.garden{flex-direction:column;align-items:flex-start}.qtext{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Trang chủ, lịch, mốc quà, game ===== */

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border-radius:16px;background:var(--leaf-soft);padding:12px;display:flex;flex-direction:column;gap:2px;text-align:center}.mini.alt{background:var(--sun-soft)}.mini b{font:800 1.8rem/1.1 "Baloo 2",Nunito,sans-serif}.mini span{font-weight:800;font-size:.95rem}.mini small{font-size:.75rem;line-height:1.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal-h{text-align:center;font-size:.75rem;font-weight:800;color:var(--muted);padding:2px 0}

.cal-d.done{background:var(--leaf-soft);border-color:var(--leaf)}.cal-d.part{background:var(--sun-soft);border-color:var(--sun)}.cal-d.task{background:var(--sky-soft)}.cal-d.fut{opacity:.45}.cal-d.today{box-shadow:0 0 0 2px var(--sky)}.cal-d.sel{outline:3px solid var(--sky);outline-offset:1px}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--line);margin-right:5px;vertical-align:-2px}.lg.done{background:var(--leaf-soft);border-color:var(--leaf)}.lg.part{background:var(--sun-soft);border-color:var(--sun)}.lg.task{background:var(--sky-soft)}
.cal-nav{padding:6px 16px;font-size:1.3rem;box-shadow:none}.calbox{border-radius:14px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.ms{display:flex;flex-direction:column;gap:8px}.ms-row{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:16px;padding:8px 10px}.ms-row.ok{background:var(--sun-soft);border-color:var(--sun)}.stk{font-size:1.9rem;width:48px;height:48px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none;filter:grayscale(1);opacity:.55}.ms-row.ok .stk{filter:none;opacity:1}
.res-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:8px}.res-row:first-of-type{border-top:0;padding-top:0}
.rid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.rid-o{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;min-height:120px;font:inherit;color:var(--fg)}.rid-o svg{width:84px;height:84px}.rid-o.right{border-color:var(--leaf);background:var(--leaf-soft)}.rid-o.wrong{opacity:.55;border-style:dashed}.rid-o span{font-size:.9rem;min-height:1.2em}
.gm-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gm-card{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;cursor:pointer}.gm-card .em{font-size:2.4rem}.gm-card b{font-size:1rem}.gm-card span{font-size:.8rem;color:var(--muted);text-align:center}
.pz{display:grid;gap:3px;margin:0 auto;width:min(100%,360px)}.pz-t{border:3px solid transparent;border-radius:6px;padding:0;background:#fff;overflow:hidden;cursor:pointer;line-height:0}.pz-t.sel{border-color:var(--sky);box-shadow:0 0 0 2px var(--sky)}.pz-t svg{width:100%;height:auto;display:block}
.colr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.sw{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}.sw[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 3px var(--sky)}
.paint svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto;background:#fff;border-radius:16px;border:2px solid var(--line)}.paint [data-act]{cursor:pointer}

.tile{border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;box-shadow:0 2px 0 var(--line)}.tile:disabled{opacity:.25;cursor:default}.tile.w{font-size:1.1rem;height:48px}
.mem{display:grid;gap:8px;grid-template-columns:repeat(4,1fr);max-width:400px;margin:0 auto;width:100%}.mc{aspect-ratio:1;border-radius:14px;border:3px solid var(--line);background:var(--sky-soft);cursor:pointer;padding:4px;font-size:1.8rem;color:var(--sky);display:flex;align-items:center;justify-content:center;font-family:inherit}.mc.up,.mc.got{background:#fff}.mc.got{border-color:var(--leaf);opacity:.75}.mc svg{width:100%;height:100%}
.msr{display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);border-radius:14px;padding:10px}.msr .stks{display:flex;flex-wrap:wrap;gap:6px}.stkb{font-size:1.4rem;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:0}.stkb[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 0 0 2px var(--leaf)}
.trow{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center}.trow input{min-width:0}

.stkgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.sc{aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;opacity:.75}.sc.on{border:2px solid var(--leaf);background:var(--leaf-soft);opacity:1}.sc small{font-size:.65rem;color:var(--muted)}.sc span{font-size:1.1rem;filter:grayscale(1)}

<style>

<script>
"use strict";
/* ===== Tiện ích ===== */
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mkRng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=Math.random;
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>dkey(new Date());
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))}
const DOW=["CN","T2","T3","T4","T5","T6","T7"];
const DOWFULL=["Chủ nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];

/* ===== Câu hỏi ===== */
function mkChoice(skill,prompt,correct,wrongs,x){
  const opts=x&&x.fixed?[correct].concat(wrongs):shuffle([correct].concat(wrongs));
  const q={id:skill+":"+(x&&x.sid||Math.floor(R()*1e9)),skill,type:"choice",prompt,opts,a:opts.indexOf(correct)};
  if(x&&x.fixed){q.opts=x.fixed;q.a=x.fixed.indexOf(correct)}
  if(x&&x.ctx)q.ctx=x.ctx; if(x&&x.viz)q.viz=x.viz; if(x&&x.why)q.why=x.why; if(x&&x.hint)q.hint=x.hint;
  return q;
}
function mkNum(skill,prompt,ans,why,hint){const q={id:skill+":"+Math.floor(R()*1e9),skill,type:"number",prompt,a:ans,why};if(hint)q.hint=hint;return q}

/* --- Toán: sinh câu hỏi ngẫu nhiên theo mức 1-3 --- */
function genCong(lv){
  if(lv===3){let a,b,c;do{a=ri(8,45);b=ri(8,45);c=ri(5,40)}while(a+b+c>100);return mkNum("cong",a+" + "+b+" + "+c+" = ?",a+b+c,"Cộng lần lượt từ trái sang phải: "+a+" + "+b+" = "+(a+b)+", rồi "+(a+b)+" + "+c+" = "+(a+b+c)+".")}
  let a,b;
  if(lv===1){const t1=ri(1,8),t2=ri(1,9-t1),x1=ri(1,8),x2=ri(1,9-x1);a=t1*10+x1;b=t2*10+x2}
  else{let x1,x2;do{x1=ri(2,9);x2=ri(2,9)}while(x1+x2<10);const t1=ri(1,7),t2=ri(1,8-t1);a=t1*10+x1;b=t2*10+x2}
  const s=a+b,x1=a%10,x2=b%10,t1=Math.floor(a/10),t2=Math.floor(b/10);
  const why=lv===2?"Hàng đơn vị: "+x1+" + "+x2+" = "+(x1+x2)+", viết "+((x1+x2)%10)+" nhớ 1. Hàng chục: "+t1+" + "+t2+" + 1 (nhớ) = "+(t1+t2+1)+". Vậy "+a+" + "+b+" = "+s+".":
    "Hàng đơn vị: "+x1+" + "+x2+" = "+(x1+x2)+". Hàng chục: "+t1+" + "+t2+" = "+(t1+t2)+". Vậy "+a+" + "+b+" = "+s+".";
  return mkNum("cong",a+" + "+b+" = ?",s,why);
}
function genTru(lv){
  if(lv===3){let a,b,c;do{a=ri(40,100);b=ri(5,35);c=ri(5,30)}while(a-b-c<1);return mkNum("tru",a+" − "+b+" − "+c+" = ?",a-b-c,"Trừ lần lượt từ trái sang phải: "+a+" − "+b+" = "+(a-b)+", rồi "+(a-b)+" − "+c+" = "+(a-b-c)+".")}
  let a,b;
  if(lv===1){do{const t1=ri(3,9),t2=ri(1,t1),x1=ri(1,9),x2=ri(0,x1);a=t1*10+x1;b=t2*10+x2}while(a<=b)}
  else{let x1,x2;do{x1=ri(0,8);x2=ri(1,9)}while(x1>=x2);const t1=ri(3,9),t2=ri(1,t1-1);a=t1*10+x1;b=t2*10+x2}
  const x1=a%10,x2=b%10,t1=Math.floor(a/10),t2=Math.floor(b/10);
  const why=lv===2?"Hàng đơn vị: "+x1+" không trừ được "+x2+", mượn 1 chục: "+(10+x1)+" − "+x2+" = "+(10+x1-x2)+". Hàng chục: "+t1+" − 1 (đã mượn) − "+t2+" = "+(t1-1-t2)+". Vậy "+a+" − "+b+" = "+(a-b)+".":
    "Hàng đơn vị: "+x1+" − "+x2+" = "+(x1-x2)+". Hàng chục: "+t1+" − "+t2+" = "+(t1-t2)+". Vậy "+a+" − "+b+" = "+(a-b)+".";
  return mkNum("tru",a+" − "+b+" = ?",a-b,why);
}
function tbl(lv){return lv===1?[2,5]:lv===2?[3,4]:[2,3,4,5]}
function genNhan(lv){const a=pick(tbl(lv)),b=ri(1,10);const sw=R()<.5;return mkNum("nhan",sw?a+" × "+b+" = ?":b+" × "+a+" = ?",a*b,a+" × "+b+" = "+(a*b))}
function genChia(lv){const a=pick(tbl(lv)),q=ri(1,10);return mkNum("chia",(a*q)+" : "+a+" = ?",q,"Vì "+a+" × "+q+" = "+(a*q)+" nên "+(a*q)+" : "+a+" = "+q)}
function genSoSanh(lv){
  if(lv===3){const big=R()<.5;const s=new Set();while(s.size<4)s.add(ri(100,999));const arr=[...s];const c=big?Math.max(...arr):Math.min(...arr);
    return mkChoice("sosanh",big?"Số nào lớn nhất?":"Số nào bé nhất?",String(c),arr.filter(n=>n!==c).map(String),{why:"So sánh hàng trăm trước, rồi đến hàng chục."})}
  const max=lv===1?99:999,min=lv===1?10:100;let a=ri(min,max),b=ri(min,max);if(R()<.15)b=a;
  if(lv===2&&R()<.4){b=Math.floor(a/10)*10+ri(0,9)}
  const c=a>b?">":a<b?"<":"=";
  const dz=Math.floor(a/10),dy=Math.floor(b/10),dh=lv===2?Math.floor(a/100):0,dh2=lv===2?Math.floor(b/100):0;
  let wy;if(c==="=")wy="Hai số giống nhau nên "+a+" = "+b+".";
  else if(lv===1&&dz!==dy)wy="So sánh hàng chục: "+dz+(dz>dy?" > ":" < ")+dy+", nên "+a+(c===">"?" > ":" < ")+b+".";
  else if(lv===2&&dh!==dh2)wy="So sánh hàng trăm: "+dh+(dh>dh2?" > ":" < ")+dh2+", nên "+a+(c===">"?" > ":" < ")+b+".";
  else wy="Các hàng cao hơn bằng nhau, so sánh tiếp hàng tiếp theo (cuối cùng là hàng đơn vị): "+a+(c===">"?" > ":" < ")+b+".";
  return mkChoice("sosanh","Điền dấu thích hợp:\n"+a+"  ...  "+b,c,[],{fixed:[">","<","="],why:wy});
}
function genTimX(lv){
  if(lv===1){const a=ri(5,60),x=ri(5,95-a);return mkNum("timx","Tìm x:  x + "+a+" = "+(x+a),x,"x = "+(x+a)+" − "+a+" = "+x)}
  if(lv===2){const a=ri(5,50),b=ri(5,95-a);return mkNum("timx","Tìm x:  x − "+a+" = "+b,a+b,"x = "+b+" + "+a+" = "+(a+b))}
  const a=ri(30,99),b=ri(5,a-5);return mkNum("timx","Tìm x:  "+a+" − x = "+b,a-b,"x = "+a+" − "+b+" = "+(a-b));
}
function genDoLuong(lv){
  const n=ri(1,9);
  if(lv===1)return mkNum("doluong",n+" dm = ? cm",n*10,"1 dm = 10 cm nên "+n+" dm = "+(n*10)+" cm");
  if(lv===2){return R()<.5?mkNum("doluong",n+" m = ? dm",n*10,"1 m = 10 dm nên "+n+" m = "+(n*10)+" dm"):mkNum("doluong",n+" m = ? cm",n*100,"1 m = 100 cm nên "+n+" m = "+(n*100)+" cm")}
  return R()<.5?mkNum("doluong",(n*10)+" cm = ? dm",n,"10 cm = 1 dm nên "+(n*10)+" cm = "+n+" dm"):mkNum("doluong",(n*10)+" dm = ? m",n,"10 dm = 1 m nên "+(n*10)+" dm = "+n+" m");
}
function clockTxt(h,m){return m===0?h+" giờ":h+" giờ "+m+" phút"}
function genDongHo(lv){
  const h=ri(1,12),m=lv===1?0:lv===2?30:pick([15,45,15,45,30]);
  const c=clockTxt(h,m),w=new Set(),h1=h%12+1,h2=(h+10)%12+1;
  [clockTxt(h1,m),clockTxt(h2,m)].forEach(x=>w.add(x));
  if(m===15)w.add(clockTxt(h,45)); else if(m===45)w.add(clockTxt(h,15)); else if(m===30)w.add(clockTxt(h,0)); else w.add(clockTxt(h,30));
  w.delete(c);
  return mkChoice("dongho","Đồng hồ chỉ mấy giờ?",c,[...w].slice(0,3),{viz:{clock:[h,m]},why:"Kim ngắn chỉ giờ, kim dài chỉ phút: "+c});
}
const NAMES=["Lan","Nam","Hà","Minh","Mai","An","Bình","Hoa","Tú","Linh"],THINGS=["quả táo","cái kẹo","quyển vở","viên bi","bông hoa","cái bút","quả cam","chiếc bánh"],CONT=["hộp","đĩa","túi","giỏ"],GIVERS=["Mẹ","Bà","Chị","Cô giáo"];
function mathLesson(){return(S.profile&&S.profile.mathLesson)||25}
/* [a, b] với a > b, theo bài Toán đang học */
function pairSub(){
  const L=mathLesson();let a,b;
  if(L<11){a=ri(12,19);b=ri(1,a%10)}
  else if(L<22){do{a=ri(11,19);b=ri(2,9)}while(a-b<2)}
  else{a=ri(30,99);b=ri(5,a-5)}
  return[a,b];
}
function genLoiVan(lv){
  const L=mathLesson(),n=pick(NAMES),m=pick(NAMES.filter(x=>x!==n)),t=pick(THINGS);
  const k=pick(L>=13?["add","sub","more","less"]:["add","sub"]),isAdd=k==="add"||k==="more";let a,b;
  if(L<19){if(isAdd){do{a=ri(3,12);b=ri(3,9)}while(a+b>20||a+b<11)}else{[a,b]=pairSub()}}
  else if(isAdd){const ao=lv===1?ri(1,8):ri(2,9);a=ri(1,6)*10+ao;b=lv===1?ri(1,9-ao):ri(10-ao,9)}
  else if(lv===1){const ao=ri(1,9);a=ri(2,8)*10+ao;b=ri(1,ao)}
  else{const ao=ri(0,8);a=ri(3,9)*10+ao;b=ri(ao+1,9)}
  const s=isAdd?a+b:a-b,kw={add:"“thêm”, “tất cả”",sub:"“cho bạn”, “còn lại”",more:"“nhiều hơn”",less:"“ít hơn”"}[k],
    why="Đề có "+kw+" nên làm phép "+(isAdd?"cộng":"trừ")+": "+a+(isAdd?" + ":" − ")+b+" = "+s+".";
  if(k==="add")return mkNum("loivan",n+" có "+a+" "+t+". "+pick(GIVERS)+" cho thêm "+b+" "+t+". Hỏi "+n+" có tất cả bao nhiêu "+t+"?",s,why);
  if(k==="sub")return mkNum("loivan",n+" có "+a+" "+t+". "+n+" cho bạn "+b+" "+t+". Hỏi "+n+" còn lại bao nhiêu "+t+"?",s,why);
  if(k==="more")return mkNum("loivan",n+" có "+a+" "+t+". "+m+" có nhiều hơn "+n+" "+b+" "+t+". Hỏi "+m+" có bao nhiêu "+t+"?",s,why);
  return mkNum("loivan",n+" có "+a+" "+t+". "+m+" có ít hơn "+n+" "+b+" "+t+". Hỏi "+m+" có bao nhiêu "+t+"?",s,why);
}
function genHonKem(){
  const n=pick(NAMES),m=pick(NAMES.filter(x=>x!==n)),t=pick(THINGS),[a,b]=pairSub();
  const why="Muốn biết hơn hoặc kém nhau bao nhiêu, ta làm phép trừ: "+a+" − "+b+" = "+(a-b);
  return R()<.5?mkNum("honkem",n+" có "+a+" "+t+", "+m+" có "+b+" "+t+". Hỏi "+n+" nhiều hơn "+m+" bao nhiêu "+t+"?",a-b,why):
    mkNum("honkem",n+" có "+a+" "+t+", "+m+" có "+b+" "+t+". Hỏi "+m+" ít hơn "+n+" bao nhiêu "+t+"?",a-b,why);
}
function genKgLit(){
  const kg=R()<.5,sub=R()<.5;let a,b;
  if(sub){a=ri(8,19);b=ri(2,a-2)}else{a=ri(2,9);b=ri(2,9)}
  const s=sub?a-b:a+b,why="Làm phép "+(sub?"trừ":"cộng")+": "+a+(sub?" − ":" + ")+b+" = "+s+(kg?" (kg).":" (lít).");
  if(kg){const p=pick([["Túi gạo","túi đường"],["Quả bí","quả dưa"],["Bao ngô","bao khoai"]]);
    return sub?mkNum("kglit",p[0]+" nặng "+a+" kg. "+p[1].charAt(0).toUpperCase()+p[1].slice(1)+" nhẹ hơn "+p[0].toLowerCase()+" "+b+" kg. Hỏi "+p[1]+" nặng bao nhiêu ki-lô-gam?",s,why):
      mkNum("kglit",p[0]+" nặng "+a+" kg, "+p[1]+" nặng "+b+" kg. Cả hai nặng bao nhiêu ki-lô-gam?",s,why)}
  return sub?mkNum("kglit","Một can có "+a+" lít nước. Mẹ dùng hết "+b+" lít. Hỏi còn lại bao nhiêu lít nước?",s,why):
    mkNum("kglit","Thùng thứ nhất đựng "+a+" lít nước, thùng thứ hai đựng "+b+" lít nước. Hỏi cả hai thùng đựng bao nhiêu lít nước?",s,why);
}
function genLoiVanOld(lv){
  const n=pick(NAMES),t=pick(THINGS),c=pick(CONT);
  if(lv===3&&!(S.profile.skillOff||{}).nhan){
    if(R()<.5){const a=pick([2,3,4,5]),b=ri(2,6);return mkNum("loivan","Mỗi "+c+" có "+a+" "+t+". Hỏi "+b+" "+c+" như vậy có tất cả bao nhiêu "+t+"?",a*b,"Phép tính: "+a+" × "+b+" = "+(a*b))}
    const k=pick([2,3,4,5]),q=ri(2,9);return mkNum("loivan","Có "+(k*q)+" "+t+" chia đều vào "+k+" "+c+". Hỏi mỗi "+c+" có bao nhiêu "+t+"?",q,"Phép tính: "+(k*q)+" : "+k+" = "+q);
  }
  const add=R()<.5;let a,b;
  if(add){const ao=lv===1?ri(1,8):ri(2,9);a=ri(1,6)*10+ao;b=lv===1?ri(1,9-ao):ri(10-ao,9);
    return mkNum("loivan",n+" có "+a+" "+t+". "+pick(GIVERS)+" cho thêm "+b+" "+t+". Hỏi "+n+" có tất cả bao nhiêu "+t+"?",a+b,"Phép tính: "+a+" + "+b+" = "+(a+b))}
  if(lv===1){const ao=ri(1,9);a=ri(2,8)*10+ao;b=ri(1,ao)}else{const ao=ri(0,8);a=ri(3,9)*10+ao;b=ri(ao+1,9)}
  return mkNum("loivan",n+" có "+a+" "+t+". "+n+" cho bạn "+b+" "+t+". Hỏi "+n+" còn lại bao nhiêu "+t+"?",a-b,"Phép tính: "+a+" − "+b+" = "+(a-b));
}
/* --- Tiếng Việt: sinh theo nhóm từ --- */
const SV=["cái bàn","cái ghế","cây bút","quyển sách","con mèo","ngôi nhà","bông hoa","con voi","xe đạp","quả cam","búp bê","quả bóng","con diều","thước kẻ","bảng lớp"],
HD=["chạy","nhảy","đọc","viết","hát","múa","bơi","ăn","ngủ","vẽ","nặn","thả diều","kể chuyện","đá cầu","xếp hình"],DD=["đẹp","cao","thấp","xanh","nhanh","chậm","ngoan","to","nhỏ","chăm chỉ","đáng yêu","xinh xắn","vui vẻ","thân thiện"];
function genTuLoai(ex){
  const g=pick([["sự vật",SV],["hoạt động",HD],["đặc điểm",DD]].filter(x=>x[0]!==ex));const others=[SV,HD,DD].filter(x=>x!==g[1]);
  const c=pick(g[1]);const w=new Set();while(w.size<3){w.add(pick(pick(others)))}
  const how={"sự vật":"Từ chỉ sự vật là tên người, vật, con vật, cây cối (trả lời cho câu hỏi Ai? Cái gì? Con gì?).","hoạt động":"Từ chỉ hoạt động cho biết người hay vật làm gì.","đặc điểm":"Từ chỉ đặc điểm cho biết người hay vật như thế nào (to, nhỏ, đẹp, chăm chỉ...)."};
  const q=mkChoice("tuloai","Từ nào chỉ "+g[0]+"?",c,[...w],{why:"\""+c+"\" là từ chỉ "+g[0]+". "+how[g[0]]});q.kind=g[0];return q;
}
const TN=[["cao","thấp"],["to","nhỏ"],["nóng","lạnh"],["sáng","tối"],["nhanh","chậm"],["dài","ngắn"],["vui","buồn"],["khỏe","yếu"],["đẹp","xấu"],["ngày","đêm"],["trên","dưới"],["xa","gần"],["già","trẻ"],["mới","cũ"],["sạch","bẩn"],["nặng","nhẹ"],["đúng","sai"]];
const DN=[["to","lớn"],["nhỏ","bé"],["xinh","đẹp"],["chăm chỉ","siêng năng"],["nhanh","mau"],["ba","bố"],["quả","trái"],["con lợn","con heo"],["học sinh","học trò"],["mẹ","má"]];
function genPair(skill,pairs,label){
  const p=pick(pairs),i=ri(0,1),w=p[i],c=p[1-i];const pool=[].concat(...pairs.filter(x=>x!==p));const d=new Set();
  while(d.size<3){const x=pick(pool);if(x!==c&&x!==w)d.add(x)}
  return mkChoice(skill,"Từ "+label+" với \""+w+"\" là:",c,[...d],{why:"\""+w+"\" và \""+c+"\" là hai từ "+label+" nhau"});
}
/* --- Tiếng Việt: ngân hàng câu hỏi cố định --- */

function fromBank(skill,i){
  const it=BANK[skill][i],sid=skill+i;
  if(typeof BANKFN!=="undefined"&&BANKFN[skill])return BANKFN[skill](it,sid);
  if(skill==="chinhta"){const wd=it[0].split("\n")[1].replace("…",it[1]);return mkChoice(skill,it[0],it[1],it.slice(2),{sid,why:"Từ đúng: "+wd+"."+(typeof csRule==="function"?csRule(it[0],it[1]):"")})}
  if(skill==="daucau"){const s=it[0],fx=[".",",","?","!"];return mkChoice(skill,"Chọn dấu câu thích hợp:\n"+s,it[1],[],{sid,fixed:fx,why:it[1]==="?"?"Đây là câu hỏi nên dùng dấu chấm hỏi.":it[1]==="!"?"Đây là câu cảm nên dùng dấu chấm than.":it[1]==="."?"Đây là câu kể nên dùng dấu chấm.":"Dấu phẩy ngăn cách các từ cùng loại."})}
  if(skill==="cauhoi"){const w=shuffle(QWORDS.filter(x=>x!==it[1])).slice(0,3);return mkChoice(skill,"Câu: "+it[0]+"\nBộ phận in đậm trả lời cho câu hỏi nào?",it[1],w,{sid,why:"Bộ phận in đậm trả lời cho câu hỏi \""+it[1]+"\""})}
  if(skill==="viethoa")return mkChoice(skill,"Cách viết tên người nào đúng?",it[0],it.slice(1),{sid,why:"Viết hoa chữ cái đầu của mỗi tiếng trong tên người: "+it[0]});
  if(skill==="sapxep")return mkChoice(skill,"Sắp xếp các từ thành câu đúng:\n"+it[0],it[1],it.slice(2),{sid,why:"Câu đúng: "+it[1]});
  return mkChoice(skill,it[1],it[2],it.slice(3),{sid,ctx:it[0],why:typeof evidenceWhy==="function"?evidenceWhy(it[0],it[2]):"Đáp án: "+it[2]+"."});
}

function genCong20(lv){
  const add=R()<.5;let a,b,s;
  if(add){do{a=ri(2,9);b=ri(2,9)}while(a+b<11);s=a+b}
  else{s=ri(11,18);b=ri(s-10+1,9);a=s}
  if(lv<=1){
    if(add){const t=10-a;return mkNum("cong20",a+" + "+b+" = ?",s,"Tách "+b+" = "+t+" + "+(b-t)+". Làm tròn 10 trước: "+a+" + "+t+" = 10, rồi 10 + "+(b-t)+" = "+s)}
    const x=a-10;return mkNum("cong20",a+" − "+b+" = ?",a-b,"Tách "+b+" = "+x+" + "+(b-x)+". "+a+" − "+x+" = 10, rồi 10 − "+(b-x)+" = "+(a-b));
  }
  if(add)return mkNum("cong20","Điền số vào chỗ trống:\n"+a+" + … = "+s,b,"Số hạng còn thiếu = "+s+" − "+a+" = "+b);
  return mkNum("cong20","Điền số vào chỗ trống:\n"+a+" − … = "+(a-b),b,"Số trừ = "+a+" − "+(a-b)+" = "+b);
}
function genLienTruoc(){
  const n=ri(11,98);
  return R()<.5?mkNum("lientruoc","Số liền trước của "+n+" là số nào?",n-1,"Số liền trước kém "+n+" một đơn vị: "+n+" − 1 = "+(n-1)):
    mkNum("lientruoc","Số liền sau của "+n+" là số nào?",n+1,"Số liền sau hơn "+n+" một đơn vị: "+n+" + 1 = "+(n+1));
}
function genHinh(){
  const L=mathLesson(),t=[];
  t.push(()=>mkChoice("hinh","Ba điểm A, B, C thẳng hàng. Ba điểm này cùng nằm trên:","một đường thẳng",["một đường cong","hai đường thẳng","một điểm"],{why:"Ba điểm thẳng hàng là ba điểm cùng nằm trên một đường thẳng."}));
  t.push(()=>{const it=pick([["Mép thước kẻ","đoạn thẳng"],["Dòng sông uốn lượn trên bản đồ","đường cong"],["Chiếc cầu vồng","đường cong"]]);
    return mkChoice("hinh",it[0]+" gợi ra hình ảnh của:",it[1],["đoạn thẳng","đường cong","một điểm","hình tròn"].filter(x=>x!==it[1]).slice(0,3),{why:it[0]+" gợi ra hình ảnh của "+it[1]+"."})});
  if(L>=26){
    t.push(()=>{const n=ri(3,5),names="ABCDE".slice(0,n).split("").join(", ");
      return mkChoice("hinh","Đường gấp khúc đi qua các điểm "+names+" gồm mấy đoạn thẳng?",String(n-1),[n-2,n,n+1].filter(x=>x>0).map(String),{why:n+" điểm nối liền nhau tạo ra "+(n-1)+" đoạn thẳng."})});
    t.push(()=>mkChoice("hinh","Hình tứ giác có mấy cạnh?","4",["3","5","6"],{why:"Tứ giác có 4 cạnh và 4 đỉnh."}));
  }
  return pick(t)();
}
function genTuDuy(){
  const L=mathLesson(),T=[];
  T.push(()=>{const d=pick([2,3,4,5,10]),up=R()<.7,a=up?ri(1,30):ri(60,95),n=5,seq=[];
    for(let i=0;i<n;i++)seq.push(up?a+i*d:a-i*d);
    const rule="Mỗi số "+(up?"hơn":"kém")+" số đứng trước "+d+" đơn vị.";
    if(R()<.5){const k=ri(1,3);return mkNum("tuduy","Tìm số còn thiếu theo quy luật:\n"+seq.map((x,i)=>i===k?"?":x).join(", "),seq[k],rule+" Số cần tìm là "+seq[k]+".")}
    return mkNum("tuduy","Tìm số tiếp theo theo quy luật:\n"+seq.slice(0,n-1).join(", ")+", ?",seq[n-1],rule+" Số tiếp theo là "+seq[n-1]+".")});
  T.push(()=>{const t=shuffle(NAMES).slice(0,3),a=ri(2,9),b=ri(2,9),c=ri(5,30);
    return mkNum("tuduy",t[0]+" có nhiều hơn "+t[1]+" "+a+" cái kẹo. "+t[1]+" có nhiều hơn "+t[2]+" "+b+" cái kẹo. "+t[2]+" có "+c+" cái kẹo. Hỏi "+t[0]+" có bao nhiêu cái kẹo?",c+a+b,
      t[2]+" có "+c+" kẹo. "+t[1]+" có "+c+" + "+b+" = "+(c+b)+" kẹo. "+t[0]+" có "+(c+b)+" + "+a+" = "+(c+a+b)+" kẹo.")});
  if(L>=19)T.push(()=>{let a,b;do{a=ri(15,68);b=ri(4,9)}while((a%10)+b<10);const r=a+b,w=r-10;
    const o=[...new Set([r,w,r+10,r-1])].map(String);
    return mkChoice("tuduy","Bạn "+pick(NAMES)+" tính: "+a+" + "+b+" = "+w+".\nBạn đã làm sai. Kết quả đúng là:",String(r),o.filter(x=>x!==String(r)),{why:a+" + "+b+" = "+r+". Bạn đã quên nhớ 1 sang hàng chục."})});
  if(L>=22)T.push(()=>{let t,x,b;do{t=ri(3,9);x=ri(0,7);b=ri(x+1,9)}while(false);const a=t*10+x,r=a-b,w=t*10+(b-x);
    const o=[...new Set([r,w,r+1,r-1])].map(String);
    return mkChoice("tuduy","Bạn "+pick(NAMES)+" tính: "+a+" − "+b+" = "+w+".\nBạn đã làm sai. Kết quả đúng là:",String(r),o.filter(x=>x!==String(r)),{why:a+" − "+b+" = "+r+". Hàng đơn vị "+x+" không đủ trừ "+b+" nên phải mượn 1 chục."})});
  T.push(()=>{const k=ri(0,2);
    if(k===0){const X=ri(23,90);return mkNum("tuduy","Số liền sau của một số là "+X+".\nSố liền trước của số đó là bao nhiêu?",X-2,"Số đó là "+X+" − 1 = "+(X-1)+". Số liền trước của nó là "+(X-1)+" − 1 = "+(X-2)+".")}
    const big=L>=22,x=big?ri(10,60):ri(3,9),d=big?ri(12,35):ri(3,9);
    if(k===1)return mkNum("tuduy","Nam nghĩ một số. Lấy số đó cộng "+d+" được "+(x+d)+".\nSố Nam nghĩ là số nào?",x,"Số đó là "+(x+d)+" − "+d+" = "+x+".");

 9 = 84.","lv":2,"hard":true,"hint":"Chọn phép tính theo từ khóa của đề, rồi đặt tính cẩn thận, chú ý nhớ hoặc mượn."},{"id":"canlit:734222348","skill":"canlit","type":"number","prompt":"Tính: 43 l − 35 l = ? l","a":8,"why":"43 − 35 = 8 (l).","hint":"Trừ hai số rồi viết đơn vị lít.","lv":1,"hard":false},{"id":"chuyenbang:473375007","skill":"chuyenbang","type":"number","prompt":"Lan và Linh có số quyển vở khác nhau. Nếu Lan cho Linh 4 quyển vở thì số quyển vở của hai bạn bằng nhau.\nHỏi lúc đầu Lan nhiều hơn Linh bao nhiêu quyển vở?","a":8,"why":"Cho đi 4 thì Lan bớt 4 và Linh thêm 4 mới bằng nhau. Vậy lúc đầu hơn nhau 4 + 4 = 8.","hint":"Vẽ hai đoạn thẳng. Lan bớt 4, Linh thêm 4 thì bằng nhau, nên chênh nhau 2 lần 4.","lv":1,"hard":true},{"id":"gapkhuc:808363809","skill":"gapkhuc","type":"number","prompt":"Đường gấp khúc ABCD có đoạn thẳng AB dài 6 cm, đoạn thẳng BC dài 3 cm, đoạn thẳng CD dài 2 cm.\nĐộ dài đường gấp khúc ABCD là bao nhiêu xăng-ti-mét?","a":11,"why":"Độ dài đường gấp khúc là tổng độ dài các đoạn thẳng: 6 + 3 + 2 = 11 (cm).","hint":"Cộng độ dài tất cả các đoạn thẳng của đường gấp khúc.","viz":{"k":"poly","pts":[[30,104,0],[100,34,1],[170,104,0],[250,34,1]]},"lv":1,"hard":true},{"id":"cong:358791144","skill":"cong","type":"number","prompt":"75 + 16 = ?","a":91,"why":"Hàng đơn vị: 5 + 6 = 11, viết 1 nhớ 1. Hàng chục: 7 + 1 + 1 (nhớ) = 9. Vậy 75 + 16 = 91.","lv":2,"hard":true,"hint":"Cộng hàng đơn vị trước. Nếu được 10 trở lên thì nhớ 1 sang hàng chục."},{"id":"thanhngu:thanhngu15","skill":"thanhngu","type":"choice","prompt":"Câu nào có hình ảnh so sánh (dùng chữ “như”)?","opts":["Mặt trời chiếu sáng cả sân.","Mặt trời đỏ như quả cầu lửa.","Mặt trời mọc ở đằng đông.","Buổi sáng, mặt trời lên."],"a":1,"why":"Mặt trời được so sánh với quả cầu lửa.","hint":"Tìm câu có chữ “như” và so sánh hai sự vật.","lv":1,"hard":false,"retry":true},{"id":"morong:morong1","skill":"morong","type":"choice","prompt":"Thêm bộ phận nào để cho biết khi nào?\nChúng em đi học ….   let ids=(o.skill||o.think)?base.filter(id=>o.skill||skillOn(id)):base.filter(skillOn).filter(id=>o.hai?!!SKILLS[id].adv:(!SKILLS[id].adv||advOpen(SKILLS[id].subj)));if(!ids.length)ids=base.filter(id=>SKILLS[id].subj==="vi").length?base.filter(id=>SKILLS[id].subj==="vi"):base;
  const rest=n-qs.length,counts={};
  const toan=ids.filter(i=>SKILLS[i].subj==="toan"),vi=ids.filter(i=>SKILLS[i].subj==="vi");
  let subjList=[];
  if(toan.length&&vi.length){const m=Math.round(rest*0.55);for(let i=0;i<rest;i++)subjList.push(i<m?toan:vi);subjList=shuffle(subjList)}
  else for(let i=0;i<rest;i++)subjList.push(toan.length?toan:vi);
  subjList.forEach(group=>{
    const ws=group.map(id=>skillWeight(id)/(1+(counts[id]||0)*1.6));
    let r=R()*ws.reduce((a,b)=>a+b,0),pickId=group[group.length-1];
    for(let i=0;i<group.length;i++){r-=ws[i];if(r<=0){pickId=group[i];break}}
    counts[pickId]=(counts[pickId]||0)+1;qs.push(makeQ(pickId,used));
  });
  R=Math.random;PICFORCE=false;
  if(mode==="daily")qs.sort((a,b)=>(SKILLS[a.skill].subj==="toan"?0:1)-(SKILLS[b.skill].subj==="toan"?0:1));
  return{mode,date,qs,i:0,res:[],finished:false,started:Date.now(),label:o.label||"",hai:!!o.hai};
}
function ensureDaily(){const t=todayKey();if(!S.daily||S.daily.date!==t){S.daily=buildSession("daily",t);persist()}}

/* ===== Chấm điểm ===== */
function isCorrect(q,given){return q.type==="number"?Number(given)===q.a:given===q.a}
function dayOf(date){return S.days[date]||(S.days[date]={correct:0,total:0,stars:0,xcorrect:0,xtotal:0,xstars:0,hcorrect:0,htotal:0,hstars:0,done:false})}
const dayLearn=d=>d?(d.stars||0)+(d.xstars||0)+(d.hstars||0):0;
function learnTotal(){return Object.values(S.days).reduce((a,d)=>a+dayLearn(d),0)}
function ledgerDay(k){return S.ledger.filter(e=>e.date===k).reduce((a,e)=>a+e.pts,0)}
function haiStarsToday(){const d=S.days[todayKey()];return d?d.hstars||0:0}
function extraStarsToday(){const d=S.days[todayKey()];return d?d.xstars||0:0}
function answer(sess,given,meta){
  const q=sess.qs[sess.i],ok=isCorrect(q,given),date=sess.date;
  const day=dayOf(date);
  const k=sk(q.skill);k.done++;if(ok)k.correct++;k.recent.push(ok?1:0);k.recent=k.recent.slice(-8);
  if(SKILLS[q.skill].lvl&&k.recent.length>=5){
    const a=k.recent.slice(-5).reduce((x,y)=>x+y,0)/5;
    if(a>=.8&&k.lv<capOf(q.skill)){k.lv++;k.recent=[]}else if(a<=.4&&k.lv>1){k.lv--;k.recent=[]}
  }
  if(SKILLS[q.skill].bank)S.seen[q.id]=(S.seen[q.id]||0)+1;
  let gain=0;
  if(sess.mode==="daily"){day.total++;if(ok){day.correct++;gain=1;day.stars++}}
  else if(sess.hai){day.htotal=(day.htotal||0)+1;if(ok){day.hcorrect=(day.hcorrect||0)+1;const g=Math.min(2,10-(day.hstars||0));if(g>0){gain=g;day.hstars=(day.hstars||0)+g}}}
  else{day.xtotal++;if(ok){day.xcorrect++;if((day.xstars||0)<10){gain=1;day.xstars=(day.xstars||0)+1}}}
  S.stars+=gain;if(typeof logWeek==="function")logWeek(q.skill,ok,!!(meta&&meta.hint),q);
  const had=S.errors.length;
  if(ok){S.errors=S.errors.filter(e=>e.q.id!==q.id);if(had>0&&S.errors.length===0)S.flags.cleared=true}
  else if(!S.errors.some(e=>e.q.id===q.id)){const c=Object.assign({},q);delete c.retry;S.errors.push({q:c,date});if(S.errors.length>30)S.errors.shift()}
  sess.gain=(sess.gain||0)+gain;sess.res[sess.i]=Object.assign({ok,ans:given},meta||{});persist();
  return{ok,gain};
}
function finish(sess){
  const correct=sess.res.filter(r=>r&&r.ok).length,total=sess.qs.length;let bonus=0;
  sess.finished=true;
  if(sess.mode==="daily"){
    const day=dayOf(sess.date);
    day.done=true;bonus=2;
    if(correct===total){bonus+=3;S.perfects++}
    const st=streak();if(st>S.maxStreak)S.maxStreak=st;
    if([3,7,14,30].includes(st))bonus+=5;
    day.stars+=bonus;S.stars+=bonus;
  }
  const newBadges=checkBadges();
  sess.summary={correct,total,bonus,stars:(sess.gain||0)+bonus,newBadges:newBadges.map(b=>b.id),streak:streak()};
  if(sess.mode==='daily'||sess.mode==='extra'){S.history.push({d:sess.date,m:sess.mode==='daily'?'daily':sess.hai?'hai':'extra',l:sess.mode==='daily'?'Bài hằng ngày':(sess.label||'Luyện thêm'),c:correct,t:total,s:sess.summary.stars,at:Date.now()});if(S.history.length>200)S.history.shift()}
  persist();
}

function genTdLich(){

function genTdLogic(){

    return mkChoice("td_logic",x+" cao hơn "+y+". "+y+" cao hơn "+z+".\n"+qs[0],qs[1],[x,y,z].filter(t=>t!==qs[1]),{why:"Sắp xếp từ cao đến thấp: "+x+", "+y+", "+z+". "+qs[0].replace("?",":")+" "+qs[1]+".",hint:"Xếp các bạn thành một hàng từ cao đến thấp theo từng câu đã cho."})});

    return mkNum("td_logic",x+", "+y+" và "+z+" có tất cả "+t+" cái bút. "+y+" có nhiều hơn "+x+" nhưng ít hơn "+z+".\nHỏi "+(w?z:y)+" có mấy cái bút?",w?res[2]:res[1],"Số bút theo thứ tự "+x+" < "+y+" < "+z+" và tổng bằng "+t+" là "+res.join(", ")+" ("+res.join(" + ")+" = "+t+"). "+y+" có "+res[1]+", "+z+" có "+res[2]+".","Mỗi bạn có ít nhất 1 cái và ba số khác nhau. Thử bộ số bé nhất 1, 2, 3 rồi tăng dần.")});
  T.push(()=>{const r=ri(0,2),w=[x,y,z][r],ask=["Bạn nào về nhất?","Bạn nào về thứ hai?","Bạn nào về thứ ba?"][r];
    return mkChoice("td_logic",x+", "+y+" và "+z+" chạy thi. "+x+" không về cuối. "+z+" không về đầu. "+y+" không về đầu cũng không về cuối.\n"+ask,w,[x,y,z].filter(t=>t!==w),{why:y+" không về đầu, không về cuối nên về thứ hai. "+x+" không về cuối mà "+y+" đã về thứ hai nên "+x+" về nhất. Còn lại "+z+" về thứ ba.",hint:"Bạn không về đầu cũng không về cuối thì về thứ mấy? Từ đó suy ra hai bạn còn lại."})});
  return pick(T)();
}
function genTdTongHieu(){
  const T=[],[x,y,z]=shuffle(NAMES).slice(0,3);

    const names=[x,y,z],vals=[a,b,c],others=names.filter((_,i)=>i!==w),ov=vals.filter((_,i)=>i!==w).reduce((p,q)=>p+q,0);
    return mkNum("td_tonghieu",x+", "+y+" và "+z+" cùng hái hoa được tất cả "+tot+" bông. "+others[0]+" và "+others[1]+" hái được "+ov+" bông.\nHỏi "+names[w]+" hái được bao nhiêu bông?",vals[w],"Cả ba bạn hái "+tot+" bông, hai bạn kia hái "+ov+" bông nên "+names[w]+" hái "+tot+" − "+ov+" = "+vals[w]+" bông.","Lấy tổng số hoa của cả ba bạn trừ đi số hoa của hai bạn đã biết.")});
  T.push(()=>{const u=ri(1,5),d=ri(2,6),S=2*u+d;if(S>=10)return genTdTongHieu();
    const col=pick([["bi xanh","bi đỏ","viên"],["bút đen","bút màu","cái"]]);
    return mkNum("td_tonghieu",x+" có tất cả "+S+" "+col[2]+" "+col[0].split(" ")[0]+" gồm "+col[0]+" và "+col[1]+" (mỗi loại đều có). Số "+col[1]+" nhiều hơn số "+col[0]+" là "+d+".\nHỏi có bao nhiêu "+col[1]+"?",u+d,"Thử: "+col[0]+" là "+u+" thì "+col[1]+" là "+u+" + "+d+" = "+(u+d)+"; tổng "+u+" + "+(u+d)+" = "+S+". Đúng. Vậy có "+(u+d)+" "+col[1]+".","Thử từng số: nếu "+col[0]+" là 1 thì "+col[1]+" là bao nhiêu? Tổng có bằng "+S+" không?")});
  T.push(()=>{const sm=ri(2,5),d=ri(1,3),S=2*sm+d;return mkNum("td_tonghieu","Hai số có tổng bằng "+S+" và hiệu bằng "+d+".\nSố lớn là số nào?",sm+d,"Thử: "+(sm+d)+" + "+sm+" = "+S+" và "+(sm+d)+" − "+sm+" = "+d+". Số lớn là "+(sm+d)+".","Thử các cặp số có tổng bằng "+S+": 1 và "+(S-1)+", 2 và "+(S-2)+"... cặp nào hơn kém nhau "+d+"?")});
  return pick(T)();
}

function hintOf(q){
  if(q.hint)return q.hint;
  const k=q.skill,lv=q.lv||1;
  if((k==="cong"||k==="tru")&&lv>=3)return SKHINT[k+"3"];
  if((k==="cong"||k==="tru")&&lv===2)return SKHINT[k+"2"];
  if(k==="loivan"&&lv>=2)return SKHINT.loivan2;
  return SKHINT[k]||"Đọc kỹ đề bài, gạch dưới các số quan trọng rồi làm từng bước nhỏ.";
}
function finalizeQ(q){
  const d=SKILLS[q.skill];if(!d)return q;
  q.lv=q.lv||(d.lvl?skillLevel(q.skill):1);
  q.hard=!!(d.adv||(["loivan","cong","tru"].includes(q.skill)&&q.lv>=2)||q.skill==="haibuoc"||q.skill==="gapkhuc");
  q.hint=hintOf(q);
  if(!q.why)q.why=q.type==="number"?"Đáp án là "+q.a+".":"Đáp án đúng: "+q.opts[q.a]+".";
  return q;
}

function evidenceWhy(ctx,ans){
  const A="Đáp án đúng: "+String(ans).replace(/[.]+$/,"")+".";
  if(!ctx||/^\(\d\)/.test(ans))return /^\(\d\)/.test(ans)?"Thứ tự hợp lí là: "+ans+". Việc làm trước thì nói trước, việc làm sau thì nói sau.":A;
  const stop=["và","là","có","của","cho","đã","rất","một","các","những","vì","nên","cũng","với","ở","trong"],
    toks=s=>s.toLowerCase().replace(/[“”".,!?:;()\n]/g," ").split(/\s+/).filter(w=>w&&!stop.includes(w)),
    sents=ctx.replace(/([.!?”])\s+/g,"$1|").replace(/\n/g,"|").split("|").map(x=>x.trim()).filter(Boolean),
    at=new Set(toks(ans));let best=null,bs=0;
  sents.forEach(s=>{const st=new Set(toks(s));let n=0;at.forEach(w=>{if(st.has(w))n++});if(n>bs){bs=n;best=s}});
  return best?"Chi tiết trong đoạn: “"+best+"” "+A:A;
}
function csRule(p,c){
  const h=p.split("\n")[0];
  if(/c hay k/.test(h))return " Quy tắc: âm k đứng trước i, e, ê; âm c đứng trước các chữ còn lại.";
  if(/g hay gh/.test(h))return " Quy tắc: gh đứng trước i, e, ê; g đứng trước các chữ còn lại.";
  if(/ng hay ngh/.test(h))return " Quy tắc: ngh đứng trước i, e, ê; ng đứng trước các chữ còn lại.";
  if(/l hay n/.test(h))return " Con nhớ nghĩa của từ để phân biệt l và n.";
  if(/ch hay tr/.test(h))return " Con nhớ từ cô đã dạy để phân biệt ch và tr.";
  if(/s hay x/.test(h))return " Con nhớ từ cô đã dạy để phân biệt s và x.";
  if(/d, gi hay r/.test(h))return " Con nhớ từ cô đã dạy để phân biệt d, gi và r.";
  return " Đọc to cả từ lên, từ nào có nghĩa thì chọn.";
}

<script>

const sf=(f,s,w)=>'style="fill:'+f+(s?";stroke:"+s+";stroke-width:"+(w||2):"")+'"';
function plantSVG(stage){
  const base=118,h=stage===0?0:16+stage*14,top=base-h;let o='<svg viewBox="0 0 130 150" role="img" aria-label="Cây ở cấp '+(stage+1)+'">';
  o+='<path d="M30 122h70l-8 24H38z" '+sf("var(--soil)")+'/><rect x="26" y="114" width="78" height="12" rx="5" '+sf("var(--soil)")+' opacity=".85"/>';
  o+='<ellipse cx="65" cy="116" rx="34" ry="5" '+sf("#5a3a24")+' opacity=".5"/>';
  if(stage===0){o+='<ellipse cx="65" cy="112" rx="6" ry="4" '+sf("var(--sun)")+'/>'}
  else{
    o+='<path d="M65 '+base+'V'+top+'" fill="none" style="stroke:var(--leaf);stroke-width:5;stroke-linecap:round"/>';
    const n=Math.min(stage+1,5);
    for(let i=0;i<n;i++){const y=base-10-i*(h-8)/Math.max(n-1,1)*0.95,right=i%2===0,x=right?65:65,rot=right?-35:35;
      o+='<ellipse cx="'+(right?80:50)+'" cy="'+y.toFixed(1)+'" rx="15" ry="7" transform="rotate('+rot+' '+(right?80:50)+' '+y.toFixed(1)+')" '+sf("var(--leaf)")+' opacity="'+(i%2?".8":"1")+'"/>'}
    if(stage>=3){const r=stage>=4?9:6;const c=stage>=4?"#F28DB2":"var(--sun)";
      for(let a=0;a<5;a++){const ang=a*72*Math.PI/180;o+='<circle cx="'+(65+Math.sin(ang)*r*1.2).toFixed(1)+'" cy="'+(top-Math.cos(ang)*r*1.2).toFixed(1)+'" r="'+r*.8+'" '+sf(c)+'/>'}
      o+='<circle cx="65" cy="'+top+'" r="'+r*.6+'" '+sf("var(--sun)")+'/>'}
    if(stage>=5){[[44,top+18],[86,top+22],[65,top+34]].forEach(p=>{o+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" '+sf("#E4483E")+'/><path d="M'+p[0]+' '+(p[1]-7)+'q2-5 5-6" fill="none" style="stroke:var(--leaf);stroke-width:2"/>'})}
  }
  return o+'</svg>';
}
function clockSVG(h,m){
  let o='<svg viewBox="-60 -60 120 120" role="img" aria-label="Đồng hồ"><circle r="56" '+sf("var(--surface)","var(--fg)",3)+'/>';
  for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;o+='<text x="'+(Math.sin(a)*43).toFixed(1)+'" y="'+(-Math.cos(a)*43+5).toFixed(1)+'" text-anchor="middle" style="fill:var(--fg);font:700 13px Nunito,sans-serif">'+i+'</text>'}
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,l=i%5?2:4;o+='<line x1="'+(Math.sin(a)*54).toFixed(1)+'" y1="'+(-Math.cos(a)*54).toFixed(1)+'" x2="'+(Math.sin(a)*(54-l)).toFixed(1)+'" y2="'+(-Math.cos(a)*(54-l)).toFixed(1)+'" style="stroke:var(--muted);stroke-width:1"/>'}
  const ha=((h%12)+m/60)*30*Math.PI/180,ma=m*6*Math.PI/180;
  o+='<line x1="0" y1="0" x2="'+(Math.sin(ha)*26).toFixed(1)+'" y2="'+(-Math.cos(ha)*26).toFixed(1)+'" style="stroke:var(--fg);stroke-width:6;stroke-linecap:round"/>';
  o+='<line x1="0" y1="0" x2="'+(Math.sin(ma)*38).toFixed(1)+'" y2="'+(-Math.cos(ma)*38).toFixed(1)+'" style="stroke:var(--sky);stroke-width:4;stroke-linecap:round"/>';
  return o+'<circle r="4" '+sf("var(--fg)")+'/></svg>';
}

function weekStrip(){
  const t=todayKey();let o='<div class="week">';
  for(let i=6;i>=0;i--){const k=addDays(t,-i),[y,m,d]=k.split("-").map(Number),dow=new Date(y,m-1,d).getDay();
    o+='<div class="dot'+(S.days[k]&&S.days[k].done?" done":"")+(i===0?" today":"")+'">'+DOW[dow]+'<b></b></div>'}
  return o+'</div>';
}

function viewPractice(){

  [["toan","Chọn kỹ năng Toán"],["vi","Chọn kỹ năng Tiếng Việt"]].forEach(g=>{
    const ids=Object.keys(SKILLS).filter(i=>SKILLS[i].subj===g[0]&&!SKILLS[i].think&&skillOn(i)),groups={};
    ids.forEach(i=>{const k=SKILLS[i].grp||"khac";(groups[k]=groups[k]||[]).push(i)});
    o+='<div class="card"><h3>'+g[1]+'</h3>'+Object.keys(groups).map(k=>'<div class="grp-h">'+esc(GRPNAME[k]||"Khác")+'</div>'+chips(groups[k])).join("")+'</div>';
  });
  const th=Object.keys(SKILLS).filter(i=>SKILLS[i].think&&skillOn(i));
  if(th.length)o+='<div class="card"><h3>Chọn kỹ năng tư duy</h3><p class="muted small">Câu hỏi cần suy nghĩ thêm. Có nút gợi ý để con xem khi cần.</p><div class="row"><button class="btn grow" data-act="startExtra" data-think="1" data-label="Luyện tư duy">5 câu tư duy</button></div>'+chips(th)+'</div>';
  return o;
}
function chartSVG(){
  const t=todayKey(),days=[];for(let i=13;i>=0;i--){const k=addDays(t,-i),d=S.days[k]||{};days.push({k,v:(d.correct||0)+(d.xcorrect||0)+(d.hcorrect||0),done:!!d.done})}
  const max=Math.max(10,...days.map(d=>d.v)),W=560,H=190,L=30,B=24,T=14,bw=(W-L)/14;
  let o='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Số câu đúng 14 ngày gần nhất">';
  [0,.5,1].forEach(f=>{const y=T+(H-B-T)*(1-f);o+='<line x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line);stroke-width:1"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+Math.round(max*f)+'</text>'});
  days.forEach((d,i)=>{const h=(H-B-T)*d.v/max,x=L+i*bw+bw*.18,w=bw*.64,y=H-B-h;
    if(d.v)o+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4" '+sf(d.done?"var(--leaf)":"var(--sun)")+'/><text x="'+(x+w/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle">'+d.v+'</text>';
    o+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle">'+Number(d.k.slice(8))+'</text>'});
  return o+'</svg>';
}

/* Que tính: bó chục và que lẻ */
function rods(n,x,y,crossT,crossU){
  const t=Math.floor(n/10),u=n%10;let o="";
  for(let i=0;i<t;i++){const cx=x+i*11,bad=i<(crossT||0);
    o+='<g opacity="'+(bad?.4:1)+'"><rect x="'+cx+'" y="'+y+'" width="8" height="46" rx="2" '+st("#F2B84B","#B07A12",1.2)+'/>'+[1,2,3,4,5,6,7,8,9].map(j=>'<path d="M'+cx+' '+(y+j*4.6)+'h8" stroke="#B07A12" stroke-width=".8"/>').join("")+'</g>';
    if(bad)o+='<path d="M'+(cx-4)+' '+(y+8)+'L'+(cx+12)+' '+(y+38)+'M'+(cx+12)+' '+(y+8)+'L'+(cx-4)+' '+(y+38)+'" stroke="#CF3F37" stroke-width="3" stroke-linecap="round"/>'}
  const ox=x+t*11+(t?8:0);
  for(let i=0;i<u;i++){const cx=ox+(i%3)*11,cy=y+Math.floor(i/3)*12,bad=i<(crossU||0);
    o+='<rect x="'+cx+'" y="'+(cy+22)+'" width="8" height="8" rx="2" '+st("#F2B84B","#B07A12",1.2)+' opacity="'+(bad?.4:1)+'"/>';
    if(bad)o+='<path d="M'+(cx-2)+' '+(cy+20)+'L'+(cx+10)+' '+(cy+32)+'M'+(cx+10)+' '+(cy+20)+'L'+(cx-2)+' '+(cy+32)+'" stroke="#CF3F37" stroke-width="2.6" stroke-linecap="round"/>'}
  return o;
}
function tenFrame(x,y,n,fill,crossN,crossFrom){
  let o='<rect x="'+x+'" y="'+y+'" width="130" height="52" rx="4" fill="#fff" stroke="'+INK+'" stroke-width="1.6"/><path d="M'+(x+26)+' '+y+'v52M'+(x+52)+' '+y+'v52M'+(x+78)+' '+y+'v52M'+(x+104)+' '+y+'v52M'+x+' '+(y+26)+'h130" stroke="'+INK+'" stroke-width="1" opacity=".5"/>';
  for(let i=0;i<n;i++){const cx=x+13+(i%5)*26,cy=y+13+Math.floor(i/5)*26,bad=crossN&&crossN.includes(i);
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="9.5" '+st(fill,"rgba(0,0,0,.35)",1)+' opacity="'+(bad?.4:1)+'"/>';
    if(bad)o+='<path d="M'+(cx-8)+' '+(cy-8)+'L'+(cx+8)+' '+(cy+8)+'M'+(cx+8)+' '+(cy-8)+'L'+(cx-8)+' '+(cy+8)+'" stroke="#CF3F37" stroke-width="3" stroke-linecap="round"/>'}

}
function gridObjs(name,n,x0,y0,cols,dx,dy,k,crossN){let o="";for(let i=0;i<n;i++)o+=obj(name,x0+(i%cols)*dx,y0+Math.floor(i/cols)*dy,k,i<(crossN||0));return o}

}

  [[lx,ly,v.left||[]],[rx,ry,v.right||[]]].forEach(p=>{const px=p[0],py=p[1]+46;
    o+='<path d="M'+px+' '+p[1]+'L'+(px-30)+' '+py+'M'+px+' '+p[1]+'L'+(px+30)+' '+py+'" stroke="#5C3A22" stroke-width="1.6"/><path d="M'+(px-38)+' '+py+'H'+(px+38)+'Q'+(px+30)+' '+(py+12)+' '+px+' '+(py+12)+'Q'+(px-30)+' '+(py+12)+' '+(px-38)+' '+py+'Z" '+st("#C9CFD4","#6B7882",1.6)+'/>';
    const its=p[2],n=its.length;its.forEach((it,i)=>{o+=panItem(it,px+(i-(n-1)/2)*(n>1?36:0),py)})});

}
function vzJugs(v){

    o+='<rect x="'+x0+'" y="'+(top+h-fillH)+'" width="'+w+'" height="'+fillH+'" '+st("#7BBDF0")+' opacity=".85"/>';
    o+='<path d="M'+x0+' '+top+'V'+(top+h)+'H'+(x0+w)+'V'+top+'" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linejoin="round"/><path d="M'+(x0+w)+' '+(top+22)+'q16 0 16 22t-16 22" fill="none" stroke="'+INK+'" stroke-width="2.6" stroke-linecap="round"/>';
    for(let k=1;k<=cap;k++){const y=top+h-k*unit;o+='<path d="M'+(x0)+' '+y+'h'+(k%(cap>5?2:1)===0?12:7)+'" stroke="'+INK+'" stroke-width="1.6"/>';if(cap<=5||k%2===0)o+=txt(x0-4,y+3.5,k,10,"end")}

function vizHTML(v){

  switch(v.k){
    case"cmp2":{let o='<rect x="8" y="8" width="146" height="104" rx="12" fill="#fff" stroke="#C9D8CF" stroke-width="2"/><rect x="166" y="8" width="146" height="104" rx="12" fill="#fff" stroke="#C9D8CF" stroke-width="2"/>';

    case"rows":{let o=gridObjs(v.it,v.a,24,30,12,25,0,.7)+gridObjs(v.it,v.b,24,80,12,25,0,.7)+'<path d="M8 55H312" stroke="#C9D8CF" stroke-width="2" stroke-dasharray="4 4"/>';return svgWrap(320,108,o,"Hai hàng đồ vật")}

    case"rodsadd":return svgWrap(320,80,rods(v.a,12,14)+txt(158,52,"+",28)+rods(v.b,186,14),"Que tính của hai số");
    case"rodsub":return svgWrap(320,80,rods(v.a,30,14,v.tb,v.ub),"Que tính, phần gạch chéo là bớt đi");
    case"tia":return vzTia(v);
    case"ten":return svgWrap(320,80,tenFrame(14,14,v.a,"#F27B6E",v.cross1)+(v.plus?txt(160,52,"+",26):"")+tenFrame(176,14,v.b,"#6AAFE6",v.cross2),"Hai khung mười ô");
    case"scale":return vzScale(v);
    case"jugs":return vzJugs(v);
    case"shapes":return vzShapes(v);
    case"poly":return vzPoly(v);
    case"col":return vzCol(v);
    case"pat":return vzPat(v);
    case"mix":return vzMix(v);
    case"scene":return vzScene(v);
    case"two":return vzTwo(v);
    case"seq":return vzSeq(v);
    case"obj":return vzObj(v);
  }
  return "";
}

<script>
/* ===== Trang chủ, Hằng ngày, Kết quả ===== */
const MONTHS=["","tháng 1","tháng 2","tháng 3","tháng 4","tháng 5","tháng 6","tháng 7","tháng 8","tháng 9","tháng 10","tháng 11","tháng 12"];
function calState(){
  if(!ui.cal){const d=new Date();ui.cal={y:d.getFullYear(),m:d.getMonth()}}
  return ui.cal;
}
function dayCellTotal(k){return dayLearn(S.days[k])+ledgerDay(k)}
function calendarCard(){
  const c=calState(),first=new Date(c.y,c.m,1),days=new Date(c.y,c.m+1,0).getDate(),lead=(first.getDay()+6)%7,t=todayKey();
  let o='<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="btn alt cal-nav" data-act="calMove" data-d="-1" aria-label="Tháng trước">‹</button><h2 style="text-align:center">'+MONTHS[c.m+1][0].toUpperCase()+MONTHS[c.m+1].slice(1)+' / '+c.y+'</h2><button class="btn alt cal-nav" data-act="calMove" data-d="1" aria-label="Tháng sau">›</button></div>';
  o+='<div class="cal">'+["T2","T3","T4","T5","T6","T7","CN"].map(x=>'<div class="cal-h">'+x+'</div>').join("");
  for(let i=0;i<lead;i++)o+='<span></span>';
  let monthStars=0,monthDone=0;
  for(let d=1;d<=days;d++){
    const k=dkey(new Date(c.y,c.m,d)),day=S.days[k],tot=dayCellTotal(k),done=!!(day&&day.done),learn=dayLearn(day)>0,fut=k>t;
    monthStars+=Math.max(0,tot);if(done)monthDone++;
    const cls="cal-d"+(done?" done":learn?" part":tot!==0?" task":"")+(k===t?" today":"")+(fut?" fut":"")+(ui.calSel===k?" sel":"");
    o+='<button class="'+cls+'" data-act="calSel" data-k="'+k+'" aria-label="Ngày '+d+(done?", đã làm bài":"")+(tot?", "+tot+" sao":"")+'"><b>'+d+'</b><i>'+(tot?(tot>0?tot:tot)+"★":"")+'</i></button>';
  }
  o+='</div><div class="row small muted" style="gap:14px"><span><i class="lg done"></i>Đã làm bài hằng ngày</span><span><i class="lg part"></i>Có luyện tập</span><span><i class="lg task"></i>Chỉ có sao nhiệm vụ</span></div>';
  o+='<p class="small"><b>Tháng này:</b> '+monthDone+' ngày hoàn thành bài · '+monthStars+' sao</p>';
  const sk=ui.calSel||t,[y,m,dd]=sk.split("-").map(Number),dy=S.days[sk]||{},led=S.ledger.filter(e=>e.date===sk);
  o+='<div class="calbox"><b>Ngày '+dd+'/'+m+'</b>';

  else{
    if(dy.total)o+='<div class="small">Bài hằng ngày: đúng '+dy.correct+'/'+dy.total+' câu'+(dy.done?" (đã hoàn thành)":" (chưa xong)")+' · '+(dy.stars||0)+' sao</div>';
    if(dy.xtotal)o+='<div class="small">Luyện thêm: đúng '+(dy.xcorrect||0)+'/'+dy.xtotal+' câu · '+(dy.xstars||0)+' sao</div>';
    if(dy.htotal)o+='<div class="small">Bài hái sao: đúng '+(dy.hcorrect||0)+'/'+dy.htotal+' câu · '+(dy.hstars||0)+' sao</div>';
    led.forEach(e=>{o+='<div class="small">'+(e.pts>=0?"Thưởng":"Trừ")+': '+esc(e.label)+' ('+(e.pts>0?"+":"")+e.pts+' sao)</div>'});

}

   '<div class="two"><div class="mini"><b>'+learn+'</b><span>Sao học tập</span><small class="muted">bài hằng ngày, luyện tập, hái sao</small></div><div class="mini alt"><b>'+bonus+'</b><span>Sao khen thưởng</span><small class="muted">nhiệm vụ khác ở nhà</small></div></div></div>';

   '<div class="row"><button class="btn alt grow" data-act="result">Xem lại kết quả</button><button class="btn grow" data-act="tab" data-t="practice">Luyện thêm</button></div></div>';

   (S.place.adv&&(S.place.adv.toan||S.place.adv.vi)?'':'<p class="small muted">Nếu con thấy khó, hãy làm bài hằng ngày trước rồi quay lại sau.</p>')+

function resultRows(){
  const hs=S.history.slice(),has={};hs.forEach(h=>{if(h.m==="daily")has[h.d]=1});

  const wk=weakSkills();

   wk.map(w=>'<div class="res-row"><div class="grow"><b>'+esc(SKILLS[w.id].name)+'</b><div class="small muted">'+(w.a===null?'Được ưu tiên sau bài kiểm tra đầu vào':'Đúng '+Math.round(w.a*100)+'% trong '+w.n+' câu')+'</div></div><button class="btn alt" style="padding:6px 14px;font-size:.9rem;box-shadow:none" data-act="startExtra" data-skill="'+w.id+'">Luyện</button></div>').join("")+
   (S.errors.length?'<div class="res-row"><div class="grow"><b>Vở sửa lỗi</b><div class="small muted">'+S.errors.length+' câu con từng làm sai</div></div><button class="btn alt" style="padding:6px 14px;font-size:.9rem;box-shadow:none" data-act="startErrors">Làm lại</button></div>':'')
   :'<p class="muted">Chưa có phần nào cần luyện thêm. Con cứ làm bài đều đặn nhé!</p>')+'<p class="small muted">Chỉ dựa trên những câu con đã làm, không phải đánh giá toàn diện.</p></div>';

/* ---- Từ và câu ---- */
const GW=[["kite","diều"],["drum","trống"],["bell","chuông"],["chair","ghế"],["scissors","kéo"],["glasses","kính"],["book","sách"],["pencil","bút"],["tree","cây"],["house","nhà"],["flower","hoa"],["ball","bóng"],["star","sao"],["apple","táo"],["orange","cam"],["heart","tim"]].map(x=>[x[0],x[1].normalize("NFC")]);
const GW2=[["kite","cánh diều"],["book","sách vở"],["pencil","bút chì"],["apple","quả táo"],["orange","quả cam"],["ball","quả bóng"],["star","ngôi sao"],["flower","bông hoa"],["tree","cây xanh"],["house","ngôi nhà"],["bell","tiếng chuông"],["drum","cái trống"],["chair","cái ghế"],["scissors","cái kéo"],["glasses","cặp kính"],["heart","trái tim"],["bag","cặp sách"],["bike","xe đạp"],["sun","mặt trời"]].map(x=>{const d=x[1].normalize("NFC");return[x[0],d.replace(/ /g,""),d]});
const GS=["Em đọc sách ở thư viện.","Mẹ nấu cơm cho cả nhà.","Bé tưới nước cho cây.","Chú mèo nằm ngủ trên ghế.","Trời hôm nay có nắng đẹp.","Bạn Lan đang vẽ tranh.","Chim hót líu lo trên cành cây.","Em đá bóng cùng các bạn.","Hoa hồng nở đỏ rực trong vườn.","Ông bà kể chuyện cho em nghe."];
function newLetters(){
  const r=gshuf(gshuf(GW).slice(0,1).concat(gshuf(GW2).slice(0,5)));return{id:"letters",stage:"play",round:r,idx:0,solved:0,st:null};
}
function loadWord(g){
  const w=g.round[g.idx][1],ch=Array.from(w);
  g.chars=ch;g.order=gshuf(ch.map((c,i)=>i));g.slots=ch.map(()=>null);g.res=null;
}
function newSent(){const L=GS.filter(s=>s.split(" ").length>=6),r=gshuf(L.length>=5?L:GS).slice(0,5);return{id:"sent",stage:"play",round:r,idx:0,solved:0}}
function loadSent(g){
  const w=g.round[g.idx].split(" ");g.words=w;g.order=gshuf(w.map((x,i)=>i));g.placed=[];g.res=null;
}
function newMemory(n){
  const keys=gshuf(["orange","apple","ball","star","flower","kite","book","bell","drum","house","tree","heart"]).slice(0,n/2),cards=gshuf(keys.concat(keys));
  return{id:"memory",stage:"play",n,cards,up:[],got:[],moves:0,lock:false};
}

/* ---- Giao diện ---- */
function gameHead(title){
  return '<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><button class="btn alt" style="padding:8px 14px;box-shadow:none" data-act="g_back">‹ Game khác</button><h2 class="grow" style="text-align:center">'+title+'</h2><span style="width:24px"></span></div>';
}
function gDone(msg,again){return '<div class="fb ok"><b>'+msg+'</b></div><div class="row"><button class="btn grow" data-act="'+again+'">Chơi lại</button><button class="btn alt grow" data-act="g_back">Chọn game khác</button></div>'}
function viewGames(){
  const g=ui.game;
  if(!g)return '<div class="card"><h2>Góc chơi của '+esc(S.profile.name)+'</h2><p class="muted">Chơi cho vui và thư giãn. Chơi cho vui là chính. Sao chỉ dành cho lúc con làm tốt ở mức khó (xem bên dưới).</p><div class="gm-grid">'+GAMES.map(x=>'<button class="gm-card" data-act="g_open" data-id="'+x.id+'"><span class="em">'+x.em+'</span><b>'+x.name+'</b><span>'+x.desc+'</span></button>').join("")+'</div></div>';
  const T=GAMES.find(x=>x.id===g.id);
  if(g.id==="puzzle")return gPuzzle(g,T);
  if(g.id==="paint")return gPaint(g,T);
  if(g.id==="letters")return gLetters(g,T);
  if(g.id==="sent")return gSent(g,T);
  return gMemory(g,T);
}
function gPuzzle(g,T){

function gPaint(g,T){

function gLetters(g,T){
  let o=gameHead(T.name);
  if(g.idx>=g.round.length)return o+'<p>Con ghép đúng <b>'+g.solved+'/'+g.round.length+'</b> từ.</p>'+gDone("Hoàn thành rồi!","g_lettersAgain")+'</div>';
  const w=g.round[g.idx];
  o+='<p class="small muted" style="text-align:center">Từ '+(g.idx+1)+'/'+g.round.length+'. Chạm các chữ cái để xếp thành tên của hình'+(w[2]?' (từ có '+w[2].split(" ").length+' tiếng, viết liền không cách)':'')+'.</p><div class="viz pic">'+svgWrap(120,100,grp(60,50,2.2,OBJ[w[0]]()),"Hình vẽ một vật",170)+'</div>';
  o+='<div class="slots">'+g.slots.map((s,j)=>'<button class="slot'+(s!==null?" on":"")+(g.res==="ok"?" ok":"")+'" data-act="g_slot" data-j="'+j+'" aria-label="Ô '+(j+1)+(s!==null?": "+g.chars[s]:" trống")+'"'+(g.res==="ok"?" disabled":"")+'>'+(s!==null?esc(g.chars[s]):"")+'</button>').join("")+'</div>';
  o+='<div class="pool">'+g.order.map(i=>'<button class="tile" data-act="g_tile" data-i="'+i+'"'+(g.slots.includes(i)||g.res==="ok"?" disabled":"")+'>'+esc(g.chars[i])+'</button>').join("")+'</div>';
  if(g.res==="ok")o+='<div class="fb ok"><b>Đúng rồi! Đó là "'+esc(w[2]||w[1])+'".</b></div><button class="btn big" data-act="g_next">'+(g.idx>=g.round.length-1?"Xem kết quả":"Từ tiếp theo")+'</button>';
  else{if(g.res==="bad")o+='<div class="fb hint"><b>Chưa đúng</b><span>Chạm vào chữ trong ô để bỏ ra, rồi xếp lại nhé.</span></div>';o+='<div class="row"><button class="btn alt grow" data-act="g_wclear">Xóa hết</button><button class="btn alt grow" data-act="g_next">Bỏ qua từ này</button></div>'}
  return o+'</div>';
}
function gSent(g,T){
  let o=gameHead(T.name);
  if(g.idx>=g.round.length)return o+'<p>Con xếp đúng <b>'+g.solved+'/'+g.round.length+'</b> câu.</p>'+gDone("Hoàn thành rồi!","g_sentAgain")+'</div>';
  o+='<p class="small muted" style="text-align:center">Câu '+(g.idx+1)+'/'+g.round.length+'. Chạm các từ theo đúng thứ tự để thành câu.</p>';
  o+='<div class="slots" style="min-height:60px;border:2px dashed var(--line);border-radius:14px;padding:8px;align-items:center">'+(g.placed.length?g.placed.map((i,k)=>'<button class="tile w" style="'+(g.res==="ok"?"background:var(--leaf-soft);border-color:var(--leaf)":"")+'" data-act="g_wback" data-k="'+k+'"'+(g.res==="ok"?" disabled":"")+'>'+esc(g.words[i])+'</button>').join(""):'<span class="muted">Câu của con ở đây</span>')+'</div>';
  o+='<div class="pool">'+g.order.map(i=>'<button class="tile w" data-act="g_wadd" data-i="'+i+'"'+(g.placed.includes(i)||g.res==="ok"?" disabled":"")+'>'+esc(g.words[i])+'</button>').join("")+'</div>';
  if(g.res==="ok")o+='<div class="fb ok"><b>Đúng rồi! Giỏi lắm!</b></div><button class="btn big" data-act="g_snext">'+(g.idx>=g.round.length-1?"Xem kết quả":"Câu tiếp theo")+'</button>';
  else{if(g.res==="bad")o+='<div class="fb hint"><b>Câu chưa đúng</b><span>Chạm vào từ trong câu để bỏ ra, rồi xếp lại nhé. Đọc to câu lên xem có hay không.</span></div>';o+='<div class="row"><button class="btn alt grow" data-act="g_sclear">Xóa hết</button><button class="btn alt grow" data-act="g_snext">Bỏ qua câu này</button></div>'}
  return o+'</div>';

function gMemory(g,T){
  let o=gameHead(T.name);
  if(g.stage==="pick")return o+'<p class="muted">Chọn số thẻ.</p><div class="opts">'+[6,8,12].map(n=>'<button class="opt" data-act="g_memStart" data-n="'+n+'">'+n+' thẻ</button>').join("")+'</div></div>';
  const cols=g.n===12?4:g.n===8?4:3;
  o+='<p class="small muted" style="text-align:center">Lật hai thẻ mỗi lượt. Số lượt đã lật: '+g.moves+'</p><div class="mem" style="grid-template-columns:repeat('+cols+',1fr)">'+g.cards.map((k,i)=>{const up=g.up.includes(i)||g.got.includes(i);
    return '<button class="mc'+(g.got.includes(i)?" got":up?" up":"")+'" data-act="g_card" data-i="'+i+'" aria-label="'+(up?"Thẻ "+(i+1)+" đã lật":"Thẻ "+(i+1)+" úp")+'">'+(up?'<svg viewBox="-22 -22 44 44">'+OBJ[k]()+'</svg>':'?')+'</button>'}).join("")+'</div>';
  if(g.got.length===g.n)o+=gDone("Con tìm đủ các cặp rồi! Giỏi quá!","g_memAgain");
  return o+'</div>';
}

/* ---- Điều khiển game ---- */
function gameAct(a,ds){
  let g=ui.game;
  switch(a){
    case"g_open":ui.game={id:ds.id,stage:"pick"};g=ui.game;
      if(ds.id==="letters"){ui.game=newLetters();loadWord(ui.game)}
      else if(ds.id==="sent"){ui.game=newSent();loadSent(ui.game)}
      break;
    case"g_back":ui.game=null;break;
    case"g_opt":g[ds.k]=ds.k==="lv"?Number(ds.v):ds.v;break;
    case"g_pzStart":{const pic=g.pic||"kite",lv=g.lv||0,n=PZL[lv][1]*PZL[lv][2];ui.game={id:"puzzle",stage:"play",pic,lv,order:puzShuffle(n),sel:null,moves:0};break}
    case"g_pz":{const p=Number(ds.p);if(g.sel===null)g.sel=p;else if(g.sel===p)g.sel=null;else{const t=g.order[g.sel];g.order[g.sel]=g.order[p];g.order[p]=t;g.sel=null;g.moves++}break}
    case"g_paintStart":ui.game={id:"paint",stage:"play",pic:ds.pic,fills:{},c:0};break;
    case"g_color":g.c=Number(ds.c);break;
    case"g_fill":g.fills[Number(ds.r)]=PAL[g.c||0][0];break;
    case"g_paintClear":g.fills={};break;
    case"g_paintPick":ui.game={id:"paint",stage:"pick"};break;
    case"g_tile":{const i=Number(ds.i),j=g.slots.indexOf(null);if(j>=0&&!g.slots.includes(i)){g.slots[j]=i;g.res=null;if(g.slots.every(x=>x!==null)){if(g.slots.map(x=>g.chars[x]).join("")===g.round[g.idx][1].normalize("NFC")){g.res="ok";g.solved++}else{g.res="bad";g.bad=(g.bad||0)+1}}}break}
    case"g_slot":{const j=Number(ds.j);if(g.slots[j]!==null&&g.res!=="ok"){g.slots[j]=null;g.res=null}break}
    case"g_wclear":g.slots=g.chars.map(()=>null);g.res=null;break;
    case"g_next":g.idx++;if(g.idx<g.round.length)loadWord(g);break;
    case"g_lettersAgain":ui.game=newLetters();loadWord(ui.game);break;
    case"g_wadd":{const i=Number(ds.i);if(!g.placed.includes(i)&&g.res!=="ok"){g.placed.push(i);g.res=null;if(g.placed.length===g.words.length){if(g.placed.map(x=>g.words[x]).join(" ")===g.round[g.idx]){g.res="ok";g.solved++}else{g.res="bad";g.bad=(g.bad||0)+1}}}break}
    case"g_wback":{if(g.res!=="ok"){g.placed.splice(Number(ds.k),1);g.res=null}break}
    case"g_sclear":g.placed=[];g.res=null;break;
    case"g_snext":g.idx++;if(g.idx<g.round.length)loadSent(g);break;
    case"g_sentAgain":ui.game=newSent();loadSent(ui.game);break;
    case"g_memStart":ui.game=newMemory(Number(ds.n));break;
    case"g_memAgain":ui.game={id:"memory",stage:"pick"};break;
    case"g_card":{const i=Number(ds.i);if(g.lock||g.got.includes(i)||g.up.includes(i))break;g.up.push(i);
      if(g.up.length===2){g.moves++;const[a1,b1]=g.up;if(g.cards[a1]===g.cards[b1]){g.got.push(a1,b1);g.up=[]}else{g.lock=true;const me=g;setTimeout(()=>{if(ui.game===me){me.up=[];me.lock=false;render()}},900)}}
      break}
  }
}

function newRiddle(){const r=gshuf(RID).slice(0,6).map(q=>{const w=gshuf(Object.keys(RNAME).filter(k=>k!==q[0])).slice(0,3);return{k:q[0],q:q[1],h:q[2],opts:gshuf([q[0]].concat(w))}});return{id:"riddle",stage:"play",round:r,idx:0,solved:0,first:true,tried:[],res:null,hint:false}}
function gRiddle(g,T){
  let o=gameHead(T.name);
  if(g.idx>=g.round.length)return o+'<p>Con trả lời đúng ngay <b>'+g.solved+'/'+g.round.length+'</b> câu đố.</p>'+gDone("Hoàn thành rồi!","g_riddleAgain")+'</div>';
  const q=g.round[g.idx];
  o+='<p class="small muted" style="text-align:center">Câu đố '+(g.idx+1)+'/'+g.round.length+'. Đọc câu đố rồi chạm vào hình đúng.</p><div class="qtext">'+esc(q.q)+'</div>';
  o+='<div class="rid">'+q.opts.map(k=>{const t=g.tried.includes(k),ok=g.res==="ok"&&k===q.k;
    return '<button class="rid-o'+(ok?" right":t?" wrong":"")+'" data-act="g_rpick" data-k="'+k+'"'+(t||g.res==="ok"?" disabled":"")+' aria-label="'+RNAME[k]+'"><svg viewBox="-24 -24 48 48">'+OBJ[k]()+'</svg><span>'+(g.res==="ok"||t?RNAME[k]:"")+'</span></button>'}).join("")+'</div>';

  return o+'</div>';
}
(function(){
  const vg=viewGames,ga=gameAct;

  gameAct=function(a,ds){
    let g=ui.game;
    if(a==="g_open"&&ds.id==="riddle"){ui.game=newRiddle();return}
    if(g&&g.id==="riddle"){
      if(a==="g_rpick"){if(g.res==="ok")return;const q=g.round[g.idx];if(ds.k===q.k){g.res="ok";if(!g.tried.length)g.solved++}else g.tried.push(ds.k);return}
      if(a==="g_rhint"){g.hint=true;return}
      if(a==="g_rnext"){g.idx++;g.tried=[];g.res=null;g.hint=false;return}

    }

      else if(k==="#fl"){if(push({e:k,x:50,y:50,w:30,h:30,c:ds.c})>=0){const o=H.items.pop();H.items.unshift(o);ui.hsSel=0;persist()}}
      else if(k==="#t")push({e:k,x:50,y:20,s:10,c:ds.c});break}

    case"hm_wall":H.wall=ds.c;persist();break;
    case"hm_floor":H.floor=ds.c;persist();break;
    case"hm_nudge":if(it){it.x=Math.max(0,Math.min(100,it.x+Number(ds.dx)));it.y=Math.max(0,Math.min(100,it.y+Number(ds.dy)));persist()}break;

      if(it.e==="#wh")it.w=Math.max(6,Math.min(100,it.w+d*4));else if(it.e==="#wv")it.h=Math.max(6,Math.min(100,it.h+d*4));
      else if(it.e==="#fl"){it.w=Math.max(8,Math.min(100,it.w+d*4));it.h=Math.max(8,Math.min(100,it.h+d*4))}
      else if(it.e==="#t")it.s=Math.max(6,Math.min(20,it.s+d));else it.s=Math.max(5,Math.min(40,it.s+d*2));persist()}break;

    case"hm_flip":if(it){it.f=it.f?0:1;persist()}break;

    case"hm_back":if(it){H.items.unshift(H.items.splice(ui.hsSel,1)[0]);ui.hsSel=0;persist()}break;
    case"hm_del":if(it){H.items.splice(ui.hsSel,1);ui.hsSel=null;persist()}break;

}

function spText(t){return String(t||"").replace(/\n/g,". ").replace(/…|\.\.\./g," chỗ trống ").replace(/\s[+]\s/g," cộng ").replace(/\s[−-]\s/g," trừ ").replace(/\s[×x]\s/g," nhân ").replace(/\s=\s?/g," bằng ").replace(/\s[:÷]\s/g," chia ").replace(/\s+/g," ").trim()}
const VU={"không":0,"một":1,"mốt":1,"hai":2,"ba":3,"bốn":4,"tư":4,"năm":5,"lăm":5,"sáu":6,"bảy":7,"bẩy":7,"tám":8,"chín":9};
function viNumber(s){
  s=String(s||"").toLowerCase();const dg=s.replace(/(\d)[.,\s](?=\d{3}\b)/g,"$1").match(/\d+/);if(dg)return Number(dg[0]);
  const t=s.replace(/[.,!?]/g," ").split(/\s+/).filter(w=>w&&w!=="linh"&&w!=="lẻ");if(!t.length)return null;
  let h=0,i=t.indexOf("trăm");if(i>=0){if(!(t[i-1] in VU))return null;h=VU[t[i-1]]*100;t.splice(0,i+1)}
  if(!t.length)return h||null;
  if(t[0]==="mười"){return h+10+(t[1] in VU?VU[t[1]]:0)}
  if(t.includes("mươi")||t.includes("mười")){const j=t.indexOf("mươi");if(!(t[j-1] in VU))return null;return h+VU[t[j-1]]*10+(t[j+1] in VU?VU[t[j+1]]:0)}
  if(t[0] in VU)return h+VU[t[0]];return null;
}
const nz=s=>String(s||"").toLowerCase().normalize("NFC").replace(/[.,!?;:“”"'()]/g," ").replace(/\s+/g," ").trim();
function matchChoice(alts,opts){
  const sc=opts.map(o=>{const n=nz(o),w=n.split(" ").filter(Boolean);let best=0;alts.forEach(a=>{const t=nz(a);if(n&&(t===n||t.includes(n)))best=Math.max(best,1);else{const num=viNumber(a);if(num!==null&&String(num)===n)best=Math.max(best,1);else if(w.length){const ts=new Set(t.split(" "));best=Math.max(best,w.filter(x=>ts.has(x)).length/w.length)}}});return best});
  const mx=Math.max(...sc),i=sc.indexOf(mx);if(mx<.6)return -1;return sc.filter(x=>x>=mx-.01).length>1?-1:i;
}
function dictListen(cb){
  const d=SP.dict;SP.err=null;SP.heard=null;SP.listening=true;
  if(!SP.dictInit){SP.dictInit=true;d.onFinal(({text})=>{const f=SP.dcb;SP.dcb=null;if(f&&text){SP.heard=text;f([text])}try{d.stop()}catch(_){}render()});d.onState(({state})=>{if(state==="idle"){SP.listening=false;render()}})}

function listen(cb){
  if(!(window.SpeechRecognition||window.webkitSpeechRecognition)&&SP.dict)return dictListen(cb);

  try{const r=new R();r.lang="vi-VN";r.interimResults=false;r.maxAlternatives=3;SP.listening=true;SP.err=null;SP.heard=null;
    r.onresult=e=>{const alts=[];for(const x of e.results[0])alts.push(x.transcript);SP.heard=alts[0]||"";cb(alts)};
    r.onerror=e=>{SP.err=e.error==="not-allowed"||e.error==="service-not-allowed"?"Chưa được phép dùng micro. Hãy bật micro cho trang này, hoặc mở bản cài đặt trong Chrome.":e.error==="no-speech"?"Con chưa nói gì. Bấm micro và nói lại nhé.":"Không nghe rõ, con thử lại nhé."};

}

function gameEarn(g){
  if(!g||g.rew)return 0;let ok=false;
  if(g.id==="puzzle")ok=!!g.order&&g.order.every((v,i)=>v===i)&&g.lv===2&&g.moves<=18;
  else if(g.id==="memory")ok=!!g.got&&g.got.length===g.n&&g.n>=12&&g.moves<=g.n+2;
  else if(g.id==="letters"||g.id==="sent")ok=g.idx>=g.round.length&&(g.bad||0)<=1;
  else if(g.id==="riddle")ok=g.idx>=g.round.length&&g.solved>=5;
  else if(g.id==="read")ok=g.idx>=g.round.length&&(g.good||0)>=4;

}

  if(lv>=2)T.push(()=>{const a=ri(1,8),b=ri(a+8,a+20),ev=[];for(let d=a;d<=b;d++)if(d%2===0)ev.push(d);return mkNum("lichthang","Trong các ngày từ ngày "+a+" đến ngày "+b+" của một tháng (tính cả ngày "+a+" và ngày "+b+") có bao nhiêu ngày chẵn?",ev.length,"Các ngày chẵn: "+ev.join(", ")+". Có "+ev.length+" ngày chẵn.","Ngày chẵn là ngày có số kết thúc bằng 0, 2, 4, 6, 8. Liệt kê từng ngày.")});
  if(lv>=3)T.push(()=>{const last=(f+L-1)%7;return mkChoice("lichthang","Tháng "+mo+" có "+L+" ngày. Ngày 1 là "+nm(f)+".\nNgày "+L+" là thứ mấy?",nm(last),shuffle([0,1,2,3,4,5,6].filter(i=>i!==last)).slice(0,3).map(nm),{why:"Từ ngày 1 đến ngày "+L+" cách "+(L-1)+" ngày. Cứ 7 ngày thì thứ lặp lại, còn dư "+((L-1)%7)+" ngày, nên ngày "+L+" là "+nm(last)+".",hint:"Ngày 1, 8, 15, 22, 29 cùng một thứ. Đếm tiếp từ ngày gần "+L+" nhất."})});

/* --- 14. Phép tính có kết quả bằng nhau --- */
function exprOf(v,notEq){
  for(let i=0;i<40;i++){
    if(R()<.5){const c=ri(1,v-1),d=v-c;if(v>=2)return c+" + "+d}
    else{const f=ri(1,Math.max(1,100-v)),e=v+f;if(e<=100)return e+" − "+f}
  }
  return v+" + 0";
}
function genKqBang(lv){
  let a,b,c,t,base;
  if(lv>=3){do{a=ri(20,60);b=ri(10,40);c=ri(5,a+b-5)}while(a+b-c<10||a+b>100);t=a+b-c;base=a+" + "+b+" − "+c}
  else if(lv===2){a=ri(30,80);b=ri(10,a-8);t=a-b;base=a+" − "+b;if(R()<.4){let x=ri(20,60),y=ri(15,Math.min(40,99-x));t=x+y;base=x+" + "+y}}
  else{a=ri(20,55);b=ri(6,a-10);t=a-b;base=a+" − "+b}
  let good=exprOf(t);for(let k=0;k<20&&good===base;k++)good=exprOf(t);const wr=new Set();let g=0;
  while(wr.size<3&&g++<80){const dv=pick([1,-1,2,-2,10,-10]);const v=t+dv;if(v>=2&&v<=99){const e=exprOf(v);if(e!==good)wr.add(e)}}
  const arr=[...wr];while(arr.length<3)arr.push((t+arr.length+3)+" + 0");
  return mkChoice("kqbang","Phép tính nào có kết quả bằng kết quả của "+base+"?",good,arr,{why:base+" = "+t+" và "+good+" = "+t+". Hai phép tính có cùng kết quả.",hint:"Tính kết quả của "+base+" trước, rồi tính từng phép tính ở các đáp án."});
}

<script>
/* ===== v17: dạng bài mới tham khảo sách Archimedes (Toán 1–4, Tiếng Việt 1–4); số liệu và câu chữ đã đổi ===== */
(function(){
"use strict";
const XY=()=>pick(["x","y"]);

/* --- Tìm x nhiều dạng (Toán Archimedes tuần 10, 12, 14) --- */
function genTimX2(lv){
  const v=XY(),T=[];
  T.push(()=>{const a=ri(8,60),x=ri(5,95-a),s=a+x,f=ri(0,2);
    if(f===0)return mkNum("timx2","Tìm "+v+", biết:  "+v+" + "+a+" = "+s,x,v+" = "+s+" − "+a+" = "+x+". (Số hạng chưa biết = tổng − số hạng đã biết.)","Muốn tìm số hạng chưa biết, lấy tổng trừ số hạng đã biết.");
    if(f===1)return mkNum("timx2","Tìm "+v+", biết:  "+a+" + "+v+" = "+s,x,v+" = "+s+" − "+a+" = "+x+".","Muốn tìm số hạng chưa biết, lấy tổng trừ số hạng đã biết.");
    return mkNum("timx2","Tìm "+v+", biết:  "+v+" − "+a+" = "+x,s,v+" = "+x+" + "+a+" = "+s+". (Số bị trừ = hiệu + số trừ.)","Muốn tìm số bị trừ, lấy hiệu cộng với số trừ.")});
  T.push(()=>{const a=ri(30,99),x=ri(5,a-5),h=a-x;
    return mkNum("timx2","Tìm "+v+", biết:  "+a+" − "+v+" = "+h,x,v+" = "+a+" − "+h+" = "+x+". (Số trừ = số bị trừ − hiệu.)","Muốn tìm số trừ, lấy số bị trừ trừ đi hiệu.")});
  if(lv>=2){
    T.push(()=>{let a,b,x;do{a=ri(5,30);b=ri(5,30);x=ri(5,40)}while(a+b+x>100);const c=a+b+x;
      return mkNum("timx2","Tìm "+v+", biết:  "+v+" + "+a+" + "+b+" = "+c,x,"Cộng hai số đã biết: "+a+" + "+b+" = "+(a+b)+". Rồi "+v+" = "+c+" − "+(a+b)+" = "+x+".","Gộp hai số hạng đã biết lại, rồi lấy tổng trừ đi.")});
    T.push(()=>{const a=ri(20,60),c=ri(11,60),d=ri(8,40),y2=c+d,x2=y2-a;
      if(x2<5||x2>95)return genTimX2(1);
      return mkNum("timx2","Tìm "+v+", biết:  "+v+" + "+a+" = "+c+" + "+d,x2,"Vế phải: "+c+" + "+d+" = "+y2+". Rồi "+v+" = "+y2+" − "+a+" = "+x2+".","Tính vế bên phải trước, rồi giải như bài tìm số hạng.")});
  }
  if(lv>=3){
    T.push(()=>{let a,b,c;do{a=ri(20,50);b=ri(8,25);c=ri(12,50)}while(a+b+c>100);const x=a+b+c;
      return mkNum("timx2","Tìm "+v+", biết:  "+v+" − "+a+" − "+b+" = "+c,x,"Làm ngược: "+v+" = "+c+" + "+b+" + "+a+" = "+x+".","Số bị trừ = hiệu + các số trừ. Cộng cả lại.")});
    T.push(()=>{const a=ri(25,60),d=ri(8,25),c=ri(30,95);const rhs=c-d;const x2=rhs+a;
      if(x2>100||rhs<5)return genTimX2(2);
      return mkNum("timx2","Tìm "+v+", biết:  "+v+" − "+a+" = "+c+" − "+d,x2,"Vế phải: "+c+" − "+d+" = "+rhs+". Rồi "+v+" = "+rhs+" + "+a+" = "+x2+".","Tính vế phải trước. Rồi tìm số bị trừ: lấy hiệu cộng số trừ.")});
  }
  return pick(T)();
}

/* --- Số chẵn, số lẻ, số tròn chục (Toán Archimedes tuần 1) --- */
function genChanLe(lv){
  const T=[];

  if(lv>=2)T.push(()=>{const n=ri(6,49)*2+1;return mkNum("chanle","Số lẻ liền trước của "+n+" là số nào?",n-2,"Hai số lẻ liên tiếp hơn kém nhau 2 đơn vị: "+n+" − 2 = "+(n-2)+".","Số lẻ liền trước kém số đã cho 2 đơn vị.")});
